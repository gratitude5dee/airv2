name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify receipt duration accounting
        run: |
          docker cp supabase "${{ job.services.postgres.id }}:/checks"
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -f /checks/tests/agent_run_box_seconds.sql
  web:
    # GitHub-hosted runners keep pull-request validation available when the
    # optional third-party runner fleet is unavailable.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  contract-eval:
    # R-EV-07(a): replay the gated eval cases through the real control plane —
    # stub Hermes replays recorded tool-event streams, a scratch Postgres gets
    # every migration, and a recording Spectrum seam captures outbound writes.
    # No secrets; all credentials are localhost throwaways.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p evals/tsconfig.json
      - run: npm run eval:contract
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-eval-results
          path: evals/contract/results/
          retention-days: 14
