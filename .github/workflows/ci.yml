name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify receipt duration accounting
        run: |
          docker cp supabase "${{ job.services.postgres.id }}:/checks"
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -f /checks/tests/agent_run_box_seconds.sql
  web:
    # GitHub-hosted runners keep pull-request validation available when the
    # optional third-party runner fleet is unavailable.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  evals:
    # Scorer + harness checks: the evals run on a box, but the scorer itself
    # is pure and its regression tests run here on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p evals/agent-suite/tsconfig.json --noEmit
      - run: npx tsc -p evals/agent-suite/create/tsconfig.json --noEmit
      - run: npx tsc -p evals/model-bench/tsconfig.json --noEmit
      - run: npx vitest run evals/agent-suite/score.test.ts
