name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify receipt duration accounting
        run: |
          docker cp supabase "${{ job.services.postgres.id }}:/checks"
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -f /checks/tests/agent_run_box_seconds.sql
  commit-ids:
    # R-LED-02: every non-merge, non-chore commit on a PR names a finding ID.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check finding IDs in commit messages
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-commit-ids.sh
  web:
    # GitHub-hosted runners keep pull-request validation available when the
    # optional third-party runner fleet is unavailable.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  audit:
    # Fail on new high/critical production advisories (R-P0-4).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
  migrations:
    # Shadow-apply the full migration chain to scratch Postgres on every PR
    # (R-P0-5). A migration can no longer reach production unexercised.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql + jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq
      - name: Shim Supabase builtins (auth.uid, storage.buckets, service_role)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$ begin create role service_role nologin; exception when duplicate_object then null; end \$\$;
            create schema if not exists auth;
            create or replace function auth.uid() returns uuid
              language sql stable as 'select null::uuid';
            create schema if not exists storage;
            create table if not exists storage.buckets
              (id text primary key, name text not null, public boolean not null default false);
          "
      - name: Apply all migrations to scratch Postgres
        run: bash scripts/apply-migrations.sh
      - name: Re-run — second apply must be a no-op
        run: |
          bash scripts/apply-migrations.sh | tee /dev/stderr | grep -q 'Done: 0 migration'
      - name: Run SQL tests
        run: |
          for f in supabase/tests/*.sql; do
            echo "== $f"
            # agent_run_box_seconds.sql carries its own fixtures and expects an
            # empty database (the metering job runs it the same way).
            if [ "$f" = "supabase/tests/agent_run_box_seconds.sql" ]; then
              psql "$DATABASE_URL" -qc "create database migtest_empty"
              psql "postgresql://postgres@localhost:5432/migtest_empty" -v ON_ERROR_STOP=1 -qf "$f"
            else
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qf "$f"
            fi
          done
      - name: Hash check fails on an edited applied file
        run: bash scripts/test-apply-migrations.sh
  migration-diff:
    # Which commits a main push brought in; lets deploy-migrations skip
    # (without requesting the production approval) when nothing changed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^supabase/migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  deploy-migrations:
    # Production apply: only after green CI, only when a main push touched
    # supabase/migrations, and only with the production environment's
    # required-reviewer approval (R-P0-5).
    needs: [migration-diff, metering, migrations, web]
    if: needs.migration-diff.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: imkbxdsxfgmkylbgaygv
        run: bash scripts/apply-migrations.sh
  python:
    # Box-template + scripts python suites (R-CI-01). The air-vault plugin
    # tests import `agent.secret_sources` / `agent.redact` from Hermes, so the
    # pinned Hermes revision is checked out and put on PYTHONPATH. Any skipped
    # test fails the job — the suites are expected to run end to end.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install pytest cryptography jsonschema
      - name: Resolve pinned Hermes ref
        id: hermes
        # Single source of truth: the HERMES_REF pinned by the box template.
        run: |
          ref=$(sed -n 's/^HERMES_REF="${HERMES_REF:-\([^"]*\)}"$/\1/p' infra/template/setup.sh | tr -d '[:space:]')
          test -n "$ref" || { echo "::error::could not parse HERMES_REF from infra/template/setup.sh"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Fetch Hermes at the pinned ref
        run: |
          dir="$RUNNER_TEMP/hermes-agent"
          git init "$dir"
          git -C "$dir" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$dir" fetch --depth 1 origin "${{ steps.hermes.outputs.ref }}"
          git -C "$dir" checkout --force FETCH_HEAD
      - name: Run python suites (no skips allowed)
        env:
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: |
          set -o pipefail
          python3 -m pytest infra/template scripts/tests -p no:cacheprovider --strict-markers -ra | tee pytest.log
          if grep -Eq '[0-9]+ skipped' pytest.log; then
            echo "::error::python suites reported skipped tests — see the -ra summary above"
            exit 1
          fi
  coverage:
    # Vitest coverage gate (R-CI-02). Floors live in apps/web/vitest.config.ts:
    # global lines ratchet +2 points/week toward 65%, per-module floors at the
    # measured baseline (85% target).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Coverage report
        working-directory: apps/web
        run: npx vitest run --coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
  shell:
    # R-CI-05: shellcheck over the repo's shell scripts, then verify the
    # systemd units that ship in the Box template. systemd-analyze exits
    # nonzero when an ExecStart binary is missing, so box-side paths get a
    # stub executable first — the check still parses every unit fully.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (-S warning)
        run: |
          mapfile -t files < <(
            find infra/template -name '*.sh'
            printf '%s\n' scripts/*.sh infra/workers/release.sh
          )
          shellcheck -S warning "${files[@]}"
      - name: systemd-analyze verify (11 Box units)
        run: |
          while IFS= read -r bin; do
            [ -x "$bin" ] && continue
            sudo mkdir -p "$(dirname "$bin")"
            sudo sh -c 'printf "#!/bin/sh\nexit 0\n" > "$1"; chmod 755 "$1"' _ "$bin"
          done < <(
            grep -hoE '^(ExecStart|ExecStartPre|ExecStartPost|ExecCondition|ExecReload)=[-+@!]*(/[^ ]+)' \
              infra/template/*.service infra/template/*.timer \
              infra/template/learning/systemd/*.service \
              | sed -E 's/^[^=]+=[-+@!]*//' | sort -u
          )
          systemd-analyze verify \
            infra/template/*.service infra/template/*.timer \
            infra/template/learning/systemd/air-learningd.service
  skills:
    # R-CI-06: the vendored .agents/skills carry node:test suites that ran
    # nowhere. Run them; the suite must stay green.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run vendored skill tests (node:test)
        run: node --test ".agents/skills/**/*.test.mjs"
  evals:
    # R-CI-08: the eval harnesses ship tsconfigs nothing ran. Typecheck all
    # four: agent-suite, its create/ sub-suite, model-bench, and memory.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install workspace (@types for tsc)
        run: npm ci --ignore-scripts
      - name: Typecheck eval harnesses
        run: |
          npx --yes -p typescript@5 tsc -p evals/agent-suite/tsconfig.json --noEmit
          npx --yes -p typescript@5 tsc -p evals/agent-suite/create/tsconfig.json --noEmit
          npx --yes -p typescript@5 tsc -p evals/model-bench/tsconfig.json --noEmit
          npx --yes -p typescript@5 tsc -p evals/memory/tsconfig.json --noEmit
      # The evals run on a box, but the scorer itself is pure — its
      # regression tests run here on every push (R-EV-01..06).
      - run: npx vitest run evals/agent-suite/score.test.ts
  contract-eval:
    # R-EV-07(a): replay the gated eval cases through the real control plane —
    # stub Hermes replays recorded tool-event streams, a scratch Postgres gets
    # every migration, and a recording Spectrum seam captures outbound writes.
    # No secrets; all credentials are localhost throwaways.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p evals/tsconfig.json
      - run: npm run eval:contract
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-eval-results
          path: evals/contract/results/
          retention-days: 14
