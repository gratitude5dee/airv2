# Air × Muse connector. Product routes still fail closed unless the paired
# Worker and control-plane secrets are present.
name = "air-muse"
main = "src/index.ts"
account_id = "e8f42c0430906e1515a2af01d5c1d2d1"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

[[kv_namespaces]]
binding = "OAUTH_KV"
# Created during first MM0 deployment. Keep OAuth state separate from every
# control-plane and mail namespace.
id = "9c469d02ef984cee9da69621692f4bc2"

[observability]
enabled = true
head_sampling_rate = 1

# Full connector requires both secrets in the Worker and control plane.
[vars]
MUSE_ENABLED = "true"
CONTROL_PLANE_ORIGIN = "https://app.wzrd.tech"
DOCS_URL = "https://air.wzrd.tech/docs/muse"

[[durable_objects.bindings]]
name = "MUSE_USER"
class_name = "MuseUser"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MuseUser"]
