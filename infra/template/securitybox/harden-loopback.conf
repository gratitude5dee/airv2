# Strict drop-in for loopback-only daemons (taskrouter, openviking, air-learningd).
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/user/.hermes /home/user/.config /home/user/.cache /home/user/.local
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectClock=yes
RestrictRealtime=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressAllow=localhost
IPAddressDeny=any
