# Conservative drop-in for hermes-gateway + hermes-dashboard.
# NOTE: no NoNewPrivileges (air-cell setuid must survive), no IPAddressDeny
# (gateway egresses to the model API; dashboard serves externally), no
# ProtectHome changes (agent workspace lives under /home/user).
[Service]
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectClock=yes
LockPersonality=yes
RestrictRealtime=yes
