<template id="shot-12-guardian-template">
  <div data-hf-id="hf-n4af" id="s12-root" data-composition-id="shot-12-guardian" data-width="1920" data-height="1080" data-duration="7">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;src:local('Helvetica Neue')}
      #s12-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;
        font-family:'Inter var',system-ui,sans-serif;color:#F8FAFF;
        -webkit-font-smoothing:antialiased}
      #s12-root *,#s12-root *::before,#s12-root *::after{box-sizing:border-box}

      #s12-root .frame{position:absolute;inset:0}
      #s12-root .scrim{position:absolute;inset:0;background:rgba(3,8,22,.52)}
      #s12-root .center{position:absolute;left:0;right:0;top:466px;text-align:center}
      #s12-root .modules{position:absolute;left:0;right:0;top:264px;display:flex;justify-content:center;gap:16px}
      #s12-root .module{min-width:184px;padding:17px 24px;border-radius:999px;text-align:center;
        border:1px solid rgba(226,239,255,.42);background:rgba(12,25,57,.44);backdrop-filter:blur(8px);
        font-size:18px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#F0F6FF}
      #s12-root .line{position:relative;font-size:112px;font-weight:600;letter-spacing:-.055em;
        text-shadow:0 26px 70px rgba(3,10,26,.6)}
      #s12-root .line .w{display:inline-block;margin-right:.26em;will-change:transform}
      #s12-root .line .mark{background:linear-gradient(96deg,#FFFFFF 8%,#DDEBFF 55%,#A9CCFF 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent}
      #s12-root .kicker{margin-top:48px;font-size:30px;font-weight:500;letter-spacing:.34em;
        text-transform:uppercase;color:rgba(232,240,255,.78)}
    </style>

    <div data-hf-id="hf-2njs" class="frame clip" id="s12-frame" data-layout-allow-overflow="" data-start="0" data-duration="7" data-track-index="1">
      <div data-hf-id="hf-s12scrim" class="scrim" id="s12-scrim"></div>
      <div data-hf-id="hf-s12modules" class="modules" id="s12-modules"><span data-hf-id="hf-s12phone" class="module">phone</span><span data-hf-id="hf-s12inbox" class="module">inbox</span><span data-hf-id="hf-s12wallet" class="module">wallet</span><span data-hf-id="hf-s12computer" class="module">computer</span></div>
      <div data-hf-id="hf-0oij" class="center">
        <div data-hf-id="hf-cxid" class="line" id="s12-line"><span data-hf-id="hf-2mf0" class="w"><span data-hf-id="hf-zowy" class="mark">air</span>,</span><span data-hf-id="hf-kxir" class="w">your</span><span data-hf-id="hf-hp2z" class="w">composable</span><span data-hf-id="hf-ddyp" class="w">computer</span></div>
        <div data-hf-id="hf-mogb" class="kicker" id="s12-kicker">air by WZRD.tech</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-12-guardian"]');
      var frame = root.querySelector('#s12-frame');
      var modules = root.querySelectorAll('#s12-modules .module');
      var words = root.querySelectorAll('#s12-line .w');
      var kicker = root.querySelector('#s12-kicker');

      gsap.set(words,{x:230,opacity:0});
      gsap.set(modules,{y:28,opacity:0,scale:.94,transformOrigin:'50% 50%'});
      gsap.set(kicker,{y:26,opacity:0});

      var tl = gsap.timeline({paused:true,defaults:{ease:'expo.out'}});

      // Words carry shot 11's leftward vector in. The four native capabilities resolve first.
      var at = .08, gap = .085;
      for (var i = 0; i < words.length; i++){
        tl.fromTo(words[i],{x:230,opacity:.35},{x:0,opacity:1,duration:.56,ease:'power4.out',immediateRender:false},at);
        at += gap; gap *= .9;
      }
      modules.forEach(function(module,i){
        tl.to(module,{y:0,opacity:1,scale:1,duration:.58,ease:'power3.out'},.34 + i*.10);
      });
      tl.to(kicker,{y:0,opacity:1,duration:.8},1.90);

      // no exit travel: the film hands off to the end card on a soft dissolve into the same sky
      tl.to(frame,{opacity:0,duration:.42,ease:'power2.in'},5.52);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-12-guardian"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
