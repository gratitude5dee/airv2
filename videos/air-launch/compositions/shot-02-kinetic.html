    <style>

      #s02-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;

        -webkit-font-smoothing:antialiased}

      #s02-root .frame{position:absolute;inset:0}

        text-shadow:0 22px 60px rgba(3,10,26,.5)}

      #s02-root .accent{color:#E8F2FF;text-shadow:0 0 28px rgba(157,205,255,.34)}
      /* A contained typographic smear carries the word's momentum into its final,
         readable state. It is deliberately a trail, never a second headline. */
      #s02-root .accent-wrap{position:relative}
      #s02-root .air-smear{position:absolute;right:0;top:0;width:360px;height:126px;

    </style>

    <div data-hf-id="hf-fx4x" class="frame clip" id="s02-frame" data-layout-allow-overflow="" data-start="0" data-duration="7.8" data-track-index="1">
      <div data-hf-id="hf-gnwa" class="beat" id="s02-beat-a">
        <div data-hf-id="hf-r24s" class="rule" id="s02-rule"></div>
        <div data-hf-id="hf-ivtu" class="line" id="s02-line-a"><span data-hf-id="hf-9o0j" class="w">the</span><span data-hf-id="hf-26ef" class="w">future</span><span data-hf-id="hf-q3mx" class="w">of</span><span data-hf-id="hf-bgyw" class="w">interfaces</span></div>
        <div data-hf-id="hf-fxb3" class="line sub" id="s02-line-b"><span data-hf-id="hf-fj2o" class="w">is</span><span data-hf-id="hf-10gl" class="w">invisible,</span></div>

        <div data-hf-id="hf-e620" class="line" id="s02-line-c"><span data-hf-id="hf-0lrs" class="w">as</span><span data-hf-id="hf-uaa4" class="w">light</span><span data-hf-id="hf-fjm8" class="w">as</span><span data-hf-id="hf-p343" class="w accent-wrap"><span data-hf-id="hf-ifdf" class="air-smear" id="s02-smear" aria-hidden="true"><i data-hf-id="hf-seca" data-layout-allow-overlap="" style="--trail:1">air</i><i data-hf-id="hf-9s0v" data-layout-allow-overlap="" style="--trail:2">air</i><i data-hf-id="hf-ojgw" data-layout-allow-overlap="" style="--trail:3">air</i><i data-hf-id="hf-a0hx" data-layout-allow-overlap="" style="--trail:4">air</i><i data-hf-id="hf-3t32" data-layout-allow-overlap="" style="--trail:5">air</i></span><span data-hf-id="hf-8ywp" class="accent">air</span></span></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-02-kinetic"]');
      var frame = root.querySelector('#s02-frame');
      var rule = root.querySelector('#s02-rule');
      var beatA = root.querySelectorAll('#s02-beat-a .w');
      var beatB = root.querySelectorAll('#s02-beat-b .w');
      var smear = root.querySelectorAll('#s02-smear i');

      // pre-set every word off-axis to the RIGHT: the film's current runs LEFT
      gsap.set(beatA,{x:230,opacity:0});
      gsap.set(beatB,{x:230,opacity:0});
      gsap.set(smear,{x:108,autoAlpha:0});
      gsap.set(rule,{scaleX:0,transformOrigin:'0% 50%',opacity:0});

      var tl = gsap.timeline({paused:true});

      // entry continues shot 01's leftward travel — cascade with shrinking gaps
      var t = .06, gap = .075;
      beatA.forEach(function(w){
        tl.fromTo(w,{x:230,opacity:.35},{x:0,opacity:1,duration:.46,ease:'power4.out',immediateRender:false,overwrite:'auto'},t);
        t += gap; gap *= .86;
      });
      tl.to(rule,{scaleX:1,opacity:1,duration:.7,ease:'expo.out'},.34);

      // waterfall cut: beat A peels out LEFT while beat B ignites mid-path
      var out = 3.52;
      beatA.forEach(function(w,i){
        tl.to(w,{x:-230,duration:.34,ease:'power4.in'},out+i*.022);
        tl.to(w,{opacity:0,duration:.18,ease:'none'},out+i*.022);
      });
      tl.to(rule,{scaleX:0,opacity:0,duration:.28,ease:'power4.in'},out);

      var t2 = 3.70, gap2 = .062;
      beatB.forEach(function(w){
        tl.fromTo(w,{x:230,opacity:.35},{x:0,opacity:1,duration:.42,ease:'power4.out',immediateRender:false,overwrite:'auto'},t2);
        t2 += gap2; gap2 *= .84;
      });
      // Fade Motion: five deterministic ghost copies sweep through and disappear
      // exactly as the actual word resolves. The ending remains a stable lockup.
      tl.to(smear,{x:-18,autoAlpha:.44,duration:.26,stagger:{each:.045,from:'end'},ease:'power2.out'},3.88);
      tl.to(smear,{x:-142,autoAlpha:0,duration:.42,stagger:{each:.035,from:'start'},ease:'power3.in'},4.36);
      // the payoff word settles last and holds still for 0.5s before the cut
      tl.fromTo(beatB[beatB.length-1],{scale:.92},{scale:1,duration:.9,ease:'expo.out',immediateRender:false},3.86);

      tl.to(frame,{x:-34,duration:2.8,ease:'sine.inOut'},4.50);
      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},7.46);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},7.58);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-02-kinetic"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
