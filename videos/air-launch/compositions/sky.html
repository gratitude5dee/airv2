<template id="sky-template">
  <div data-hf-id="hf-sg5c" id="sky-root" data-composition-id="sky" data-width="1920" data-height="1080" data-duration="119.699">
    <style>
      #sky-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#06091A}
      #sky-root *,#sky-root *::before,#sky-root *::after{box-sizing:border-box}
      #sky-root #sky-canvas{position:absolute;inset:0;width:1920px;height:1080px;display:block}
      /* A very light vignette keeps the sky expansive instead of turning it into a dark stage. */
      #sky-root .veil{position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(120% 90% at 50% 42%,rgba(0,0,0,0) 44%,rgba(6,14,32,.22) 100%)}
    </style>

    <canvas data-hf-id="hf-y5j1" id="sky-canvas" width="1920" height="1080" class="clip" data-start="0" data-duration="119.699" data-track-index="0"></canvas>
    <div data-hf-id="hf-h5f4" class="veil"></div>

    <script src="vendor/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="sky"]');
      var canvas = root.querySelector('#sky-canvas');
      var tl = gsap.timeline({paused:true});
      window.__timelines = window.__timelines || {};

      // uProgress: 0 = starfield night -> 0.32 blue hour -> 0.55 the sun cresting the cloud sea
      // -> 1 = bright cumulus noon. This is the brand intro film's arc, walked across the whole
      // launch film: the crest lands on the 24.358 crash and noon lands on the 108.669 lockup.
      // uCrest is a separate short-lived horizon bloom so the sunrise reads as an event.
      var proxy = {t:0, p:0, crest:0};

      // The dawn ladder as a pure function of time: one driver tween, no overlapping
      // property tweens, and an exact value at any seek. Easings come from GSAP so the
      // curve is the same one the rest of the film uses.
      var EZ={lin:function(x){return x;},expo:gsap.parseEase('expo.out'),p4:gsap.parseEase('power4.out'),p2:gsap.parseEase('power2.out')};
      //          t0        t1        from   to     ease
      var LADDER=[[0.000,   2.415,    0.00,  0.00,  'lin'],
                  [2.415,   2.815,    0.00,  0.05,  'expo'],
                  [3.947,   4.297,    0.05,  0.09,  'expo'],
                  [5.433,   5.783,    0.09,  0.13,  'expo'],
                  [7.105,   7.455,    0.13,  0.17,  'expo'],
                  [10.170, 10.770,    0.17,  0.22,  'p4'  ],
                  [10.770, 24.358,    0.22,  0.34,  'lin' ],
                  [24.358, 24.608,    0.34,  0.55,  'expo'],
                  [24.608, 70.682,    0.55,  0.80,  'lin' ],
                  [70.682,102.168,    0.80,  0.95,  'lin' ],
                  [102.168,108.669,   0.95,  1.00,  'p2'  ]];
      // the crest is an event, not a state: up on the crash, gone by 28s
      var CREST =[[24.358, 24.598,    0.00,  1.00,  'expo'],
                  [24.598, 26.000,    1.00,  0.30,  'p2'  ],
                  [26.000, 28.000,    0.30,  0.00,  'lin' ]];
      function sample(tab, t){
        var v=tab[0][2];
        for(var i=0;i<tab.length;i++){
          var s0=tab[i];
          if(t>=s0[1]){ v=s0[3]; continue; }
          if(t<s0[0]) break;
          var u=(t-s0[0])/(s0[1]-s0[0]);
          return s0[2]+(s0[3]-s0[2])*EZ[s0[4]](u);
        }
        return v;
      }
      // ---- Canvas-2D fallback (no WebGL in the renderer): same arc, fewer octaves. ----
      function fallback2d(){
        var fproxy = {t:0};
        var ctx = canvas.getContext('2d');
        if(!ctx) return false;
        // fixed-seed star field, identical every seek
        var seed = 7 >>> 0;
        function rnd(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
        var stars = [];
        for(var i=0;i<220;i++){ stars.push({x:rnd()*1920, y:rnd()*660, r:0.6+rnd()*1.5, a:0.30+rnd()*0.70}); }
        function lerp(a,b,t){ return a+(b-a)*t; }
        function mixHex(c1,c2,t){
          return 'rgb('+Math.round(lerp(c1[0],c2[0],t))+','+Math.round(lerp(c1[1],c2[1],t))+','+Math.round(lerp(c1[2],c2[2],t))+')';
        }
        function stage(p, night, blue, crest, day){
          if(p<0.32) return [night, blue, p/0.32];
          if(p<0.55) return [blue, crest, (p-0.32)/0.23];
          return [crest, day, Math.min(1,(p-0.55)/0.45)];
        }
        var draw = function(p, crestGlow){
          var zt = stage(p, [8,12,30],[24,44,101],[70,104,190],[110,163,226]);
          var hz = stage(p, [14,20,44],[54,70,128],[242,166,90],[196,222,246]);
          var g = ctx.createLinearGradient(0,0,0,1080);
          g.addColorStop(0, mixHex(zt[0],zt[1],zt[2]));
          g.addColorStop(.62, mixHex(hz[0],hz[1],hz[2]));
          g.addColorStop(1, mixHex(hz[0],hz[1],hz[2]));
          ctx.fillStyle = g; ctx.fillRect(0,0,1920,1080);
          var starA = Math.max(0, 1 - p/0.28);
          if(starA>0.01){
            for(var i=0;i<stars.length;i++){
              var s=stars[i];
              ctx.fillStyle='rgba(226,238,255,'+(s.a*starA).toFixed(3)+')';
              ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
            }
          }
          if(p>0.42 && p<0.86){
            var sa = Math.min(1,(p-0.42)/0.10) * Math.min(1,(0.86-p)/0.16);
            var sy = 700 - (p-0.42)*300;
            var sg = ctx.createRadialGradient(1190,sy,0,1190,sy,520);
            sg.addColorStop(0,'rgba(255,236,196,'+(0.55*sa+0.35*crestGlow).toFixed(3)+')');
            sg.addColorStop(.35,'rgba(255,198,130,'+(0.22*sa).toFixed(3)+')');
            sg.addColorStop(1,'rgba(255,170,90,0)');
            ctx.fillStyle=sg; ctx.fillRect(670,sy-520,1040,1040);
          }
          var lit = Math.min(1, Math.max(0, (p-0.18)/0.6));
          function cloud(x,y,r,a){
            var c=ctx.createRadialGradient(x,y,0,x,y,r);
            var top = 'rgba('+Math.round(lerp(58,255,lit))+','+Math.round(lerp(72,253,lit))+','+Math.round(lerp(110,255,lit))+',';
            c.addColorStop(0, top+(a).toFixed(3)+')');
            c.addColorStop(.48, top+(a*.56).toFixed(3)+')');
            c.addColorStop(1, top+'0)');
            ctx.fillStyle=c;ctx.fillRect(x-r,y-r,r*2,r*2);
          }
          cloud(230,960,420,.74);cloud(680,1020,470,.72);cloud(1230,930,500,.67);cloud(1680,1000,420,.72);
          cloud(1680,150,285,.20*lit);cloud(250,190,230,.14*lit);
        };
        draw(0,0);
        tl.to(fproxy,{t:119.699,duration:119.699,ease:'none',onUpdate:function(){
          draw(sample(LADDER,fproxy.t), sample(CREST,fproxy.t));
        }},0);
        return true;
      }

      var gl = canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:true})
            || canvas.getContext('experimental-webgl',{antialias:false,preserveDrawingBuffer:true});

      if(!gl){
        fallback2d();
        window.__timelines["sky"] = tl;
        return;
      }

      var VS = [
        'attribute vec2 aPos;',
        'void main(){ gl_Position = vec4(aPos,0.0,1.0); }'
      ].join('\n');

      var FS = [
        'precision highp float;',
        'uniform vec2  uRes;',
        'uniform float uTime;',
        'uniform float uProgress;',
        'uniform float uCrest;',
        // deterministic value noise + fBm (no randomness, no time-of-day input)
        'float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }',
        'float noise(vec2 p){',
        '  vec2 i=floor(p), f=fract(p);',
        '  vec2 u=f*f*(3.0-2.0*f);',
        '  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));',
        '  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);',
        '}',
        'float fbm(vec2 p){',
        '  float v=0.0, a=0.5;',
        '  mat2 rot=mat2(0.8,0.6,-0.6,0.8);',
        '  for(int i=0;i<6;i++){ v+=a*noise(p); p=rot*p*2.02; a*=0.5; }',
        '  return v;',
        '}',
        // three-stage palette: night -> blue hour -> crest -> day
        'vec3 arc(float p, vec3 night, vec3 blue, vec3 crest, vec3 day){',
        '  vec3 c = mix(night, blue, smoothstep(0.0,0.32,p));',
        '  c = mix(c, crest, smoothstep(0.32,0.55,p));',
        '  c = mix(c, day,   smoothstep(0.55,1.00,p));',
        '  return c;',
        '}',
        'void main(){',
        '  vec2 uv = gl_FragCoord.xy/uRes;',
        '  float asp = uRes.x/uRes.y;',
        '  vec2 p  = vec2(uv.x*asp, uv.y);',
        '  float dawn = uProgress;',
        '  vec3 zenith  = arc(dawn, vec3(0.022,0.036,0.098), vec3(0.075,0.150,0.360), vec3(0.235,0.370,0.680), vec3(0.290,0.520,0.825));',
        '  vec3 horizon = arc(dawn, vec3(0.045,0.062,0.140), vec3(0.200,0.250,0.450), vec3(0.960,0.640,0.330), vec3(0.735,0.845,0.945));',
        '  vec3 col = mix(horizon, zenith, pow(uv.y,0.84));',
        // ---- stars: a fixed hash lattice, gone by the time the blue hour arrives ----
        '  float starFade = 1.0 - smoothstep(0.03,0.26,dawn);',
        '  if(starFade > 0.002){',
        '    vec2 sc = uv*vec2(210.0*asp,210.0);',
        '    vec2 sg = floor(sc); vec2 sf = fract(sc)-0.5;',
        '    float h = hash(sg);',
        '    float isStar = step(0.9958, h);',
        '    float mag = 0.35 + 0.65*fract(h*97.13);',
        '    float tw = 0.78 + 0.22*sin(uTime*1.7 + h*31.4);',
        '    float d = length(sf);',
        '    float star = isStar * smoothstep(0.40,0.02,d) * mag * tw;',
        '    col += vec3(0.80,0.86,1.0)*star*starFade*(0.35+0.65*uv.y);',
        '  }',
        // ---- the sun: only present through the crest window, riding the horizon line ----
        '  float sunUp = smoothstep(0.40,0.52,dawn);',
        '  float sunY  = 0.335 + (dawn-0.42)*0.20;',
        '  vec2  sunP  = vec2(0.735*asp, sunY);',
        '  float sd    = length(p - sunP);',
        '  float disc  = smoothstep(0.040,0.024,sd) * sunUp * (1.0-smoothstep(0.78,0.96,dawn));',
        '  float glow  = exp(-sd*6.4) * sunUp * (1.0-smoothstep(0.62,0.92,dawn));',
        '  col += vec3(1.00,0.86,0.62)*glow*(0.30 + 0.90*uCrest);',
        '  col = mix(col, vec3(1.0,0.965,0.90), disc*0.92);',
        // a broad daylight lift that grows as the sky opens
        '  float daylight = exp(-length(p-vec2(0.735*asp,0.46))*1.70);',
        '  col += vec3(0.052,0.062,0.074)*daylight*smoothstep(0.35,1.0,dawn);',
        // ---- two cloud scales drifting left; lit from below at the crest, white by noon ----
        '  vec2 q = p*vec2(1.95,2.45);',
        '  float drift = uTime*0.018;',
        '  float lowBase = fbm(q + vec2(-drift, uTime*.004) + fbm(q*.56-vec2(drift*.38,0.0))*.38);',
        '  float lowDetail = fbm(q*2.35 + vec2(-drift*1.42, uTime*.008));',
        '  float lowShape = lowBase*.72 + lowDetail*.28 + (0.48-uv.y)*.31;',
        '  float lowerCloud = smoothstep(.50,.76,lowShape) * (1.0-smoothstep(.48,.92,uv.y));',
        '  float highBase = fbm(q*1.25 + vec2(-drift*.62,1.9));',
        '  float upperCloud = smoothstep(.66,.84,highBase + (uv.y-.82)*.28) * smoothstep(.73,.98,uv.y);',
        '  float cloud = max(lowerCloud,upperCloud*.58);',
        '  vec3 cloudShade = arc(dawn, vec3(0.055,0.075,0.150), vec3(0.150,0.200,0.360), vec3(0.420,0.400,0.560), vec3(0.640,0.740,0.870));',
        '  vec3 cloudLight = arc(dawn, vec3(0.110,0.140,0.250), vec3(0.330,0.390,0.560), vec3(1.000,0.820,0.620), vec3(0.990,0.996,1.000));',
        '  float softness = clamp(lowBase*.72 + .20,0.0,1.0);',
        '  vec3 cloudCol = mix(cloudShade,cloudLight,softness);',
        // rim light on the cloud tops through the crest window only
        '  float rim = smoothstep(.52,.78,lowShape) * (1.0-smoothstep(.62,.88,lowShape));',
        '  cloudCol += vec3(1.0,0.72,0.40)*rim*uCrest*0.55;',
        '  col = mix(col,cloudCol,cloud*(.56+.38*smoothstep(0.2,1.0,dawn)));',
        // ordered dither to kill banding in the large gradients
        '  float dth = (hash(floor(gl_FragCoord.xy))-0.5)/255.0;',
        '  gl_FragColor = vec4(pow(max(col+dth,0.0), vec3(0.9545)), 1.0);',
        '}'
      ].join('\n');

      function compile(type, src){
        var s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
        return s;
      }
      var vs = compile(gl.VERTEX_SHADER, VS), fs = compile(gl.FRAGMENT_SHADER, FS);
      var prog = vs && fs ? gl.createProgram() : null;
      if(prog){
        gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
        if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) prog = null;
      }
      if(!prog){
        fallback2d();
        window.__timelines["sky"] = tl;
        return;
      }

      gl.useProgram(prog);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var uRes = gl.getUniformLocation(prog,'uRes');
      var uTime = gl.getUniformLocation(prog,'uTime');
      var uProg = gl.getUniformLocation(prog,'uProgress');
      var uCrest = gl.getUniformLocation(prog,'uCrest');
      gl.viewport(0,0,1920,1080);

      // time comes from the seeked timeline only — never a wall clock
      function renderFrame(t, p, c){
        gl.uniform2f(uRes, 1920, 1080);
        gl.uniform1f(uTime, t);
        gl.uniform1f(uProg, p);
        gl.uniform1f(uCrest, c);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      renderFrame(0, 0, 0);

      tl.to(proxy,{t:119.699,duration:119.699,ease:'none',onUpdate:function(){
        renderFrame(proxy.t, sample(LADDER,proxy.t), sample(CREST,proxy.t));
      }},0);

      window.__timelines["sky"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
