<template id="shot-01-open-template">
  <div data-hf-id="hf-f2rv" id="s01-root" data-composition-id="shot-01-open" data-width="1920" data-height="1080" data-duration="6">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;src:local('Helvetica Neue')}
      #s01-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Inter var',system-ui,sans-serif;color:#F7FAFF;-webkit-font-smoothing:antialiased}
      #s01-root *,#s01-root *::before,#s01-root *::after{box-sizing:border-box}
      #s01-root .frame{position:absolute;inset:0;perspective:1500px}
      #s01-root .mark{position:absolute;left:0;right:0;top:338px;text-align:center;transform-style:preserve-3d}
      #s01-root .brandline{display:flex;align-items:center;justify-content:center;gap:40px}
      #s01-root .favicon{width:132px;height:132px;margin:0;flex:0 0 auto;
        display:block;border-radius:50%;filter:drop-shadow(0 14px 30px rgba(73,151,255,.48));will-change:transform,opacity}
      /* One plain, Apple-like wordmark: no texture, no copy block, no app inventory. */
      #s01-root .word{display:inline-block;font-size:262px;font-weight:520;letter-spacing:-.078em;line-height:.86;color:#102E55;text-shadow:0 22px 70px rgba(20,53,105,.22),0 2px 1px rgba(255,255,255,.20)}
      #s01-root .word span{display:inline-block;will-change:transform,filter,opacity;transform-style:preserve-3d}
      /* Keep the supplied blackletter's descenders inside the physical crop. */
      #s01-root .wzrd-lockup{position:relative;width:500px;height:162px;margin:30px auto 0;overflow:hidden;will-change:transform,filter}
      #s01-root .wzrd-lockup::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(106deg,rgba(255,255,255,0) 36%,rgba(207,233,255,.50) 50%,rgba(255,255,255,0) 64%);mix-blend-mode:screen;opacity:.30}
      #s01-root .wzrd-lockup img{position:absolute;left:0;top:-92px;width:500px;height:auto;display:block;mix-blend-mode:screen;filter:brightness(1.28) contrast(1.08) drop-shadow(0 0 16px rgba(123,181,255,.42)) drop-shadow(0 10px 26px rgba(22,49,94,.32))}
    </style>

    <div data-hf-id="hf-6t4z" class="frame clip" id="s01-frame" data-layout-allow-overflow="" data-start="0" data-duration="6" data-track-index="1">
      <div data-hf-id="hf-9gvv" class="mark" id="s01-mark">
        <div data-hf-id="hf-s01brandline" class="brandline"><img data-hf-id="hf-s01favicon" class="favicon" id="s01-favicon" src="logos/air-brand.png" alt="Air"><div data-hf-id="hf-8hch" class="word" id="s01-word"><span data-hf-id="hf-zhz4">a</span><span data-hf-id="hf-wbiw">i</span><span data-hf-id="hf-ry5l">r</span></div></div>
        <div data-hf-id="hf-wzrdlockup" class="wzrd-lockup" id="s01-wzrd"><img data-hf-id="hf-ee4v" src="logos/wzrdtech-chrome.png" alt="WZRD.tech"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root=document.querySelector('[data-composition-id="shot-01-open"]');
      var frame=root.querySelector('#s01-frame');
      var mark=root.querySelector('#s01-mark');
      var letters=root.querySelectorAll('#s01-word span');
      var favicon=root.querySelector('#s01-favicon');
      var wzrd=root.querySelector('#s01-wzrd');

      gsap.set(frame,{autoAlpha:0,scale:1.035,transformOrigin:'50% 48%'});
      /* The small depth turn is the borrowed typographic cue: tactile at entry, then totally flat and calm. */
      gsap.set(letters,{y:64,scale:.955,rotationX:-20,rotationY:7,autoAlpha:0,filter:'blur(12px)',transformOrigin:'50% 72%'});
      gsap.set(favicon,{y:-18,scale:.78,autoAlpha:0,transformOrigin:'50% 50%'});
      gsap.set(wzrd,{y:24,scale:.975,autoAlpha:0,filter:'blur(5px)',transformOrigin:'50% 50%'});

      var tl=gsap.timeline({paused:true,defaults:{ease:'expo.out'}});
      tl.to(frame,{autoAlpha:1,scale:1,duration:.82},0);
      tl.to(favicon,{y:0,scale:1,autoAlpha:1,duration:.56},.12);
      tl.to(letters,{y:0,scale:1,rotationX:0,rotationY:0,autoAlpha:1,filter:'blur(0px)',duration:.60,stagger:{each:.09,from:'start'}},.209);
      tl.to(wzrd,{y:0,scale:1,autoAlpha:1,filter:'blur(0px)',duration:.54,ease:'power3.out'},1.045);
      // A single, almost imperceptible breath keeps the held lockup alive without becoming a loop.
      tl.to(mark,{y:-9,duration:1.42,ease:'sine.inOut'},1.68);
      tl.to(mark,{y:0,duration:1.42,ease:'sine.inOut'},3.10);
      tl.to(frame,{x:-42,duration:1.34,ease:'sine.inOut'},4.12);
      tl.to(frame,{x:-210,duration:.32,ease:'power4.in'},5.64);
      // The painted seam owns the cut; once it crosses the lockup, the lockup is gone rather
      // than half-transparent against both ink and sky.
      tl.set(frame,{autoAlpha:0},5.68);

      window.__timelines=window.__timelines||{};
      window.__timelines['shot-01-open']=tl;
      var q=new URLSearchParams(location.search);
      if(q.has('t')){tl.seek(parseFloat(q.get('t'))||0);}else if(q.get('dev')==='1'){tl.play();}
    })();
    </script>
  </div>
</template>
