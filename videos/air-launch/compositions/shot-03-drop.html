ill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect class="gs" x="2.4" y="4" width="19.2" height="12.4" rx="2.2"/><path class="gs" d="M8 20h8M12 16.4V20"/></g></svg><span data-hf-id="hf-s03ct4">a composable computer</span></div></div>

    <script src="vendor/gsap.min.js"></script>
    <script>
    (function(){
      var root=document.querySelector('[data-composition-id="shot-03-drop"]');
      var $=function(s){return root.querySelector(s);};
      var $$=function(s){return Array.prototype.slice.call(root.querySelectorAll(s));};
      var tl=gsap.timeline({paused:true,defaults:{immediateRender:false}});

      // ---- camera: punch in and out on the beat, one transform on one stage ----
      function cam(tl, stage, t, o){
        o=o||{};
        tl.to(stage,{scale:o.scale!=null?o.scale:1, x:o.x||0, y:o.y||0,
          rotation:o.rot||0, duration:o.d||.6, ease:o.e||'expo.out'}, t);
      }
      // ---- a hit: the frame answers the transient. Scale pop, optional flash, optional shake.
      function hit(tl, stage, t, o){
        o=o||{};
        var s=o.base!=null?o.base:1, amt=o.amt!=null?o.amt:.018;
        tl.to(stage,{scale:s+amt,duration:.055,ease:'power2.out'},t);
        tl.to(stage,{scale:s,duration:.30,ease:'power2.out'},t+.055);
        if(o.flash){ tl.fromTo(o.flash,{opacity:o.flashAmt||.22},{opacity:0,duration:o.flashD||.20,ease:'power2.out'},t); }
        if(o.shake){
          var a=o.shake;
          tl.to(stage,{x:'+='+a,duration:.033,ease:'none'},t);
          tl.to(stage,{x:'-='+(a*2),duration:.033,ease:'none'},t+.033);
          tl.to(stage,{x:'+='+a,duration:.033,ease:'none'},t+.066);
        }
      }
      // ---- chromatic glow: the split opens on a transient and settles back ----
      function cgPulse(tl, id, t, amt, dur){
        amt=amt||16; dur=dur||.9;
        var w=document.getElementById(id+'-warm'), c=document.getElementById(id+'-cool');
        tl.to(w,{x:-amt,y:-amt*.22,duration:.09,ease:'power2.out'},t);
        tl.to(c,{x:amt,y:amt*.22,duration:.09,ease:'power2.out'},t);
        tl.to(w,{x:-amt*.18,y:0,duration:dur,ease:'power3.out'},t+.09);
        tl.to(c,{x:amt*.18,y:0,duration:dur,ease:'power3.out'},t+.09);
      }
      function cgSet(id, amt){
        var w=document.getElementById(id+'-warm'), c=document.getElementById(id+'-cool');
        gsap.set(w,{x:-amt,y:0}); gsap.set(c,{x:amt,y:0});
      }
      // ---- Arcade pixel: draw the word tiny on a canvas, blow it up, and let the block size
      //      fall to 1 so the letters resolve out of the grid. No pixel grid is ever drawn.
      function pixelWord(canvas, text, font, color){
        var W=canvas.width, H=canvas.height, ctx=canvas.getContext('2d');
        return function(block){
          block=Math.max(1,Math.round(block));
          var w=Math.max(1,Math.round(W/block)), h=Math.max(1,Math.round(H/block));
          var off=pixelWord._o||(pixelWord._o=document.createElement('canvas'));
          off.width=w; off.height=h;
          var octx=off.getContext('2d');
          octx.clearRect(0,0,w,h);
          octx.fillStyle=color; octx.textAlign='center'; octx.textBaseline='middle';
          octx.font=font.replace(/(\d+)px/, function(m,n){ return Math.max(1,Math.round(n/block))+'px'; });
          octx.fillText(text, w/2, h/2);
          ctx.clearRect(0,0,W,H);
          ctx.imageSmoothingEnabled=false;
          ctx.drawImage(off,0,0,w,h,0,0,W,H);
        };
      }
      // ---- a card lifts out of the phone and takes the frame ----
      function takeover(tl, el, t, from, to){
        tl.fromTo(el,{x:from.x,y:from.y,scale:from.s,autoAlpha:0,rotationX:10},
                     {x:to.x,y:to.y,scale:to.s,autoAlpha:1,rotationX:0,duration:to.d||.62,ease:'expo.out'},t);
      }

      // the wave: each letter is a pill, then a highlight, then plain text
      function typerWave(tl, pid, t, per, dur){
        per=per||.026; dur=dur||.42;
        var n=0, el;
        while((el=document.getElementById(pid+'-'+n))){
          var at=t+n*per;
          tl.to(el,{backgroundColor:'rgba(244,239,230,0.92)',color:'rgba(8,14,30,1)',duration:.001},at);
          tl.to(el,{backgroundColor:'rgba(244,239,230,0.28)',color:'rgba(244,239,230,1)',duration:.09,ease:'none'},at+.10);
          tl.to(el,{backgroundColor:'rgba(244,239,230,0)',duration:.18,ease:'power2.out'},at+.20);
          n++;
        }
        return t+n*per+dur;
      }

      var stage=$('#s03-stage'), hf=$('#s03-hitflash');
      var heroes=[0,1,2,3,4].map(function(i){return $('#s03-h'+i);});
      var chips=[0,1,2,3,4].map(function(i){return $('#s03-c'+i);});
      var big=$('#s03-airbig'), mark=$('#s03-airmark');

      function armStrokes(node){
        var gs=Array.prototype.slice.call(node.querySelectorAll('.gs'));
        gs.forEach(function(g){
          var len=(g.getTotalLength?g.getTotalLength():120)||120;
          gsap.set(g,{strokeDasharray:len,strokeDashoffset:len});
        });
        return gs;
      }
      gsap.set('#s03-flash',{opacity:0});
      gsap.set(hf,{opacity:0});
      gsap.set(big,{autoAlpha:0,scale:1.16,transformOrigin:'50% 50%'});
      cgSet('s03-cgair',0);
      gsap.set(mark,{autoAlpha:0,y:12});
      heroes.forEach(function(h){ gsap.set(h,{autoAlpha:0,x:240,scale:.96}); });
      chips.forEach(function(c){ gsap.set(c,{autoAlpha:0,scale:.82,transformOrigin:'50% 50%'}); armStrokes(c); });
      var heroStrokes=heroes.map(function(h){ return armStrokes(h); });
      gsap.set(stage,{scale:1.0,transformOrigin:'50% 50%'});

      // 24.358 — THE CRASH. The sun crests behind, the frame takes a near-white hit, and the
      // name arrives at the size of the whole screen with its colour pulled apart at the edges.
      tl.fromTo('#s03-flash',{opacity:.92},{opacity:0,duration:.34,ease:'power2.out'},0);
      tl.to(big,{autoAlpha:1,scale:1,duration:.90,ease:'expo.out'},0);
      cgPulse(tl,'s03-cgair',0,44,1.10);
      hit(tl,stage,0,{amt:.055,shake:9});
      cam(tl,stage,0,{scale:1.0,d:1.2,e:'expo.out'});
      // 25.310 — the bass snare re-opens the split for one beat
      cgPulse(tl,'s03-cgair',.952,22,.60);
      hit(tl,stage,.952,{amt:.024});

      // 25.496 — the kick. The name snaps to the corner and the endowments start landing.
      tl.to(big,{scale:.16,x:-720,y:-368,autoAlpha:0,duration:.26,ease:'power3.in'},1.138);
      tl.to(mark,{autoAlpha:1,y:0,duration:.30,ease:'expo.out'},1.30);

      var AT=[1.138,2.716,4.272,5.851,7.384];
      AT.forEach(function(t,i){
        tl.to(heroes[i],{autoAlpha:1,x:0,scale:1,duration:.60,ease:'expo.out'},t);
        tl.to(heroStrokes[i],{strokeDashoffset:0,duration:.44,ease:'power2.out',stagger:.05},t+.04);
        hit(tl,stage,t,{amt:i===0?.034:.020,flash:i===0?hf:null,flashAmt:.14,flashD:.22});
        var out=(i<4)?AT[i+1]-.24:8.60;
        tl.to(heroes[i],{autoAlpha:0,scale:.46,y:330,duration:.24,ease:'power3.in'},out);
        tl.to(chips[i],{autoAlpha:1,scale:1,duration:.34,ease:'expo.out'},out+.10);
        tl.to(chips[i].querySelectorAll('.gs'),{strokeDashoffset:0,duration:.28,ease:'power2.out'},out+.10);
      });
      // the three sublines type themselves in, letter by letter, on the Arlan wave
      typerWave(tl,'s03-t0',1.36,.020);
      typerWave(tl,'s03-t1',2.94,.020);
      typerWave(tl,'s03-t4',7.60,.020);

      // a slow push through the whole drop, then the exit vector
      cam(tl,stage,1.138,{scale:1.035,d:6.6,e:'none'});
      tl.to(['#s03-chips','#s03-airmark'],{x:-230,autoAlpha:0,duration:.32,ease:'power4.in'},8.66);
      window.__timelines=window.__timelines||{};
      window.__timelines['shot-03-drop']=tl;
      var q=new URLSearchParams(location.search);
      if(q.has('t')){tl.seek(parseFloat(q.get('t'))||0);}else if(q.get('dev')==='1'){tl.play();}
    })();
    </script>
