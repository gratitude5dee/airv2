    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-07-composable-computer"]');
      var frame = root.querySelector('#s07-frame');
      var head = [root.querySelector('#s07-num'),root.querySelector('#s07-title')];
      var cards = root.querySelectorAll('#s07-cards .card');
      var badges = root.querySelectorAll('#s07-cards .badge img');
      var soon = root.querySelector('#s07-soon');
      var pill = root.querySelector('#s07-soon .pill');
      var EO = 'expo.out';

      gsap.set(head,{y:52,opacity:0});
      gsap.set(cards,{y:170,opacity:0,scale:.92,rotateX:-22,transformOrigin:'50% 100%'});
      gsap.set(badges,{scale:.5,opacity:0});
      gsap.set(soon,{x:180,opacity:0});
      gsap.set(pill,{scale:.92,transformOrigin:'50% 50%'});

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});
      tl.fromTo(frame,{x:230,opacity:.35},{x:0,opacity:1,duration:.34,ease:'power4.out',immediateRender:false},0);
      head.forEach(function(el,i){ tl.to(el,{y:0,opacity:1,duration:.7},.08 + i*.11); });

      // three cards land left to right — the third slams home exactly on the track's
      // 51s SURGE (shot starts at 48.5, so local 2.5) with a two-frame overshoot
      cards.forEach(function(c,i){
        var at = [1.10, 1.80, 2.50][i];
        tl.to(c,{y:0,opacity:1,scale:1.04,rotateX:0,duration:.72},at);
        tl.to(c,{scale:1,duration:.14,ease:'power2.out',overwrite:'auto'},at+.72);
        tl.to(badges[i],{scale:1,opacity:1,duration:.6},at+.20);
      });

      // the fourth state slides in on the film's axis, dashed and clearly unfinished
      tl.to(soon,{x:0,opacity:1,duration:.85},3.40);
      // Tactile, time-authored feedback for the pending platform state. This is a
      // finite pose change, not a hover interaction, so it scrubs identically.
      tl.to(pill,{scale:1.08,boxShadow:'0 0 32px rgba(255,201,120,.52)',duration:.16,ease:'power2.out'},4.28);
      tl.to(pill,{scale:1,boxShadow:'0 0 12px rgba(255,201,120,.18)',duration:.46,ease:'elastic.out(1,.48)'},4.44);

      // stillness, then the composed group eases LEFT into the cut
      tl.to(frame,{x:-40,duration:2.4,ease:'sine.inOut'},4.60);
      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},7.16);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},7.28);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-07-composable-computer"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
