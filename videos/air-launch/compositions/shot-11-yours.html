<template id="shot-11-yours-template">
  <div data-hf-id="hf-om09" id="s11-root" data-composition-id="shot-11-yours" data-width="1920" data-height="1080" data-duration="8">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;src:local('Helvetica Neue')}
      #s11-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;
        font-family:'Inter var',system-ui,sans-serif;color:#F6F9FF;
        -webkit-font-smoothing:antialiased}
      #s11-root *,#s11-root *::before,#s11-root *::after{box-sizing:border-box}

      #s11-root .frame{position:absolute;inset:0}
      #s11-root .stack{position:absolute;left:170px;right:170px;top:0;height:1080px;
        display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
      #s11-root .row{font-size:104px;font-weight:600;letter-spacing:-.04em;line-height:1.18;
        text-shadow:0 22px 60px rgba(3,10,26,.55)}
      #s11-root .row .own{color:rgba(238,245,255,.62);font-weight:450}
      #s11-root .row i{font-style:normal;background:linear-gradient(96deg,#FFFFFF 6%,#CFE4FF 60%,#9CC6FF 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent}
      #s11-root .row span.l{display:inline-block;will-change:transform}
    </style>

    <div data-hf-id="hf-zlpa" class="frame clip" id="s11-frame" data-layout-allow-overflow="" data-start="0" data-duration="8" data-track-index="1">
      <div data-hf-id="hf-jjhc" class="stack" id="s11-stack">
        <div data-hf-id="hf-rzgq" class="row" data-row=""><span data-hf-id="hf-3qwl" class="l"><span data-hf-id="hf-2ucw" class="own">Your</span> <i data-hf-id="hf-lno5">agent</i>,</span></div>
        <div data-hf-id="hf-j9xq" class="row" data-row=""><span data-hf-id="hf-j0h5" class="l"><span data-hf-id="hf-faz4" class="own">your</span> <i data-hf-id="hf-596b">RL environment</i>,</span></div>
        <div data-hf-id="hf-jo8r" class="row" data-row=""><span data-hf-id="hf-k7e8" class="l"><span data-hf-id="hf-fvvs" class="own">your</span> <i data-hf-id="hf-d30p">model</i>,</span></div>
        <div data-hf-id="hf-k2js" class="row" data-row=""><span data-hf-id="hf-4jin" class="l"><span data-hf-id="hf-eoyp" class="own">your</span> <i data-hf-id="hf-5c99">weights</i>.</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-11-yours"]');
      var frame = root.querySelector('#s11-frame');
      var lines = root.querySelectorAll('#s11-stack .l');

      gsap.set(lines,{x:230,opacity:0});

      var tl = gsap.timeline({paused:true});
      // riding out of shot 10 on the same leftward vector, one clause per beat
      var at = .10, gap = .46;
      for (var i = 0; i < lines.length; i++){
        tl.fromTo(lines[i],{x:230,opacity:.35},{x:0,opacity:1,duration:.62,ease:'power4.out',immediateRender:false},at);
        at += gap; gap *= .92;
      }
      // held still for ~0.7s before the last cut of the film's spine
      tl.to(frame,{x:-26,duration:2.3,ease:'sine.inOut'},2.60);
      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},7.66);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},7.78);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-11-yours"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
