          else if(it.kind==='card'){ inner=el('div','card'); inner.innerHTML=it.html; }
          else { inner=el('div','bub', it.text); }
          // a thread genuinely slides under the translucent nav: that layering is the design
          wrap.appendChild(inner); threadEl.appendChild(wrap);
          built.push({wrap:wrap, inner:inner, spec:it});
        });
        // measure once, after the whole column exists
        var gap=9, bottom=Number(threadEl.getAttribute('data-bottom')||760), acc=0, stops=[];
        built.forEach(function(b){ acc += b.wrap.offsetHeight + gap; stops.push(bottom - acc + gap); });
        var th={el:threadEl, items:built, stops:stops, bottom:bottom, start:bottom};
        built.forEach(function(b,i){
          if(b.spec.pre){ gsap.set(b.wrap,{autoAlpha:b.spec.dim?.56:1}); th.start=stops[i]; }
          else gsap.set(b.wrap,{autoAlpha:0});
        });
        gsap.set(threadEl,{y:th.start});
        return th;
      }
      // auto slide duration: never let two column moves overlap on the same property
      function slideFor(times, i){
        var d=.42; if(times[i+1]!=null) d=Math.min(d, Math.max(.16, times[i+1]-times[i]-.02)); return d;
      }
      // Reveal item i: the column rides up by exactly that item's height, the bubble pops.
      function showItem(tl, thread, t, i, opts){
        opts=opts||{};
        var b=thread.items[i], y=thread.stops[i];
        if(b.spec.hold){ y=thread.stops[i]+b.spec.hold; }
        tl.to(thread.el,{y:y,duration:opts.slide||.42,ease:'power3.out'}, t);
        tl.set(b.wrap,{autoAlpha:1}, t);
        if(b.spec.kind==='card'){
          tl.fromTo(b.inner,{y:28,autoAlpha:0,rotationX:12},{y:0,autoAlpha:1,rotationX:0,duration:.55,ease:'expo.out'}, t);
        } else if(b.spec.dim){
          tl.fromTo(b.inner,{y:14,autoAlpha:0},{y:0,autoAlpha:.56,duration:.34,ease:'power3.out'}, t);
        } else if(b.spec.side==='sent'){
          // the one overshoot in the film, because iMessage does it
          tl.fromTo(b.inner,{scale:.86,autoAlpha:0},{scale:1,autoAlpha:1,duration:.32,ease:'back.out(1.4)'}, t);
        } else {
          tl.fromTo(b.inner,{y:14,autoAlpha:0},{y:0,autoAlpha:1,duration:.34,ease:'power3.out'}, t);
        }
      }
      // typing dots ride the hihat hits of a named roll — one lift per hit, never a loop
      function typeDots(tl, dotsEl, hits){
        var ds=dotsEl.querySelectorAll('i');
        hits.forEach(function(h,i){
          var d=ds[i%3];
          tl.to(d,{y:-3,opacity:1,duration:.07,ease:'power2.out'}, h);
          tl.to(d,{y:0,opacity:.55,duration:.16,ease:'power2.inOut'}, h+.07);
        });
      }
      // per-character reveal at a fixed cadence, always landing on the send downbeat
      function typeText(tl, node, text, start, end){
        var per=(end-start)/Math.max(1,text.length);
        for(var c=1;c<=text.length;c++){
          (function(n){ tl.set(node,{textContent:text.slice(0,n)}, start+per*n); })(c);
        }
      }

      // ---- camera: punch in and out on the beat, one transform on one stage ----
      function cam(tl, stage, t, o){
        o=o||{};
        tl.to(stage,{scale:o.scale!=null?o.scale:1, x:o.x||0, y:o.y||0,
          rotation:o.rot||0, duration:o.d||.6, ease:o.e||'expo.out'}, t);
      }
      // ---- a hit: the frame answers the transient. Scale pop, optional flash, optional shake.
      function hit(tl, stage, t, o){
        o=o||{};
        var s=o.base!=null?o.base:1, amt=o.amt!=null?o.amt:.018;
        tl.to(stage,{scale:s+amt,duration:.055,ease:'power2.out'},t);
        tl.to(stage,{scale:s,duration:.30,ease:'power2.out'},t+.055);
        if(o.flash){ tl.fromTo(o.flash,{opacity:o.flashAmt||.22},{opacity:0,duration:o.flashD||.20,ease:'power2.out'},t); }
        if(o.shake){
          var a=o.shake;
          tl.to(stage,{x:'+='+a,duration:.033,ease:'none'},t);
          tl.to(stage,{x:'-='+(a*2),duration:.033,ease:'none'},t+.033);
          tl.to(stage,{x:'+='+a,duration:.033,ease:'none'},t+.066);
        }
      }
      // ---- chromatic glow: the split opens on a transient and settles back ----
      function cgPulse(tl, id, t, amt, dur){
        amt=amt||16; dur=dur||.9;
        var w=document.getElementById(id+'-warm'), c=document.getElementById(id+'-cool');
        tl.to(w,{x:-amt,y:-amt*.22,duration:.09,ease:'power2.out'},t);
        tl.to(c,{x:amt,y:amt*.22,duration:.09,ease:'power2.out'},t);
        tl.to(w,{x:-amt*.18,y:0,duration:dur,ease:'power3.out'},t+.09);
        tl.to(c,{x:amt*.18,y:0,duration:dur,ease:'power3.out'},t+.09);
      }
      function cgSet(id, amt){
        var w=document.getElementById(id+'-warm'), c=document.getElementById(id+'-cool');
        gsap.set(w,{x:-amt,y:0}); gsap.set(c,{x:amt,y:0});
      }
      // ---- Arcade pixel: draw the word tiny on a canvas, blow it up, and let the block size
      //      fall to 1 so the letters resolve out of the grid. No pixel grid is ever drawn.
      function pixelWord(canvas, text, font, color){
        var W=canvas.width, H=canvas.height, ctx=canvas.getContext('2d');
        return function(block){
          block=Math.max(1,Math.round(block));
          var w=Math.max(1,Math.round(W/block)), h=Math.max(1,Math.round(H/block));
          var off=pixelWord._o||(pixelWord._o=document.createElement('canvas'));
          off.width=w; off.height=h;
          var octx=off.getContext('2d');
          octx.clearRect(0,0,w,h);
          octx.fillStyle=color; octx.textAlign='center'; octx.textBaseline='middle';
          octx.font=font.replace(/(\d+)px/, function(m,n){ return Math.max(1,Math.round(n/block))+'px'; });
          octx.fillText(text, w/2, h/2);
          ctx.clearRect(0,0,W,H);
          ctx.imageSmoothingEnabled=false;
          ctx.drawImage(off,0,0,w,h,0,0,W,H);
        };
      }
      // ---- a card lifts out of the phone and takes the frame ----
      function takeover(tl, el, t, from, to){
        tl.fromTo(el,{x:from.x,y:from.y,scale:from.s,autoAlpha:0,rotationX:10},
                     {x:to.x,y:to.y,scale:to.s,autoAlpha:1,rotationX:0,duration:to.d||.62,ease:'expo.out'},t);
      }

      // every mini-app shot shares the same rig: one stage, one phone pose, one right plane
      function rig(pfx){
        var st=document.getElementById(pfx+'-stage');
        gsap.set(document.getElementById(pfx+'-ph'),{rotationY:-9,rotationX:4,scale:1.06,transformOrigin:'50% 50%'});
        gsap.set(document.getElementById(pfx+'-slash'),{autoAlpha:0,x:60});
        gsap.set(document.getElementById(pfx+'-expl'),{autoAlpha:0,y:14});
        return st;
      }
      // A whip: the outgoing shot is still travelling when the cut happens and the incoming
      // one picks the move up mid-flight, blurred, for two frames. It is the only transition
      // in the film that is not a straight cut.
      function whipIn(tl, stage, t, dist){
        dist = dist==null ? 210 : dist;
        tl.fromTo(stage,{x:dist,filter:'blur(13px)'},
                        {x:0,filter:'blur(0px)',duration:.20,ease:'power3.out'}, t);
      }
      function whipOut(tl, stage, t, dist){
        dist = dist==null ? 210 : dist;
        tl.to(stage,{x:-dist,filter:'blur(13px)',duration:.17,ease:'power3.in'}, t);
      }
      function rightIn(tl, pfx, t){
        tl.to('#'+pfx+'-slash',{autoAlpha:1,x:0,duration:.60,ease:'expo.out'},t);
        tl.to('#'+pfx+'-expl',{autoAlpha:1,y:0,duration:.58,ease:'expo.out'},t+.26);
      }
      function rightOut(tl, pfx, t){
        tl.to('#'+pfx+'-slash',{autoAlpha:0,x:-130,duration:.30,ease:'power4.in'},t);
        tl.to('#'+pfx+'-expl',{autoAlpha:0,y:-12,duration:.26,ease:'power3.in'},t);
      }

      var ITEMS=[
        {kind:'sys', text:'Today · 9:34 AM', pre:true},
        {side:'recv', text:'the storefront had 3 orders overnight.', pre:true, dim:true},
        {side:'sent', text:'nice', pre:true, dim:true},
        {side:'recv', text:'all three labels are printed.', pre:true, dim:true},
        {side:'sent', text:'perfect', pre:true, dim:true},
        {side:'recv', text:'the shop is live and the first order is packed.', pre:true, dim:true},
        {side:'sent', text:'i want something to post with it.', pre:true, dim:true},
        {side:'recv', text:'video or a still? i can do either.', pre:true, dim:true},
        {side:'sent', text:'/zap the orb rising over clouds, 6s'},
        {side:'recv', text:'on it — about 40s.'}
      ];
      var threadEl=$('#s09-thread'); threadEl.setAttribute('data-bottom','622');
      var TH=buildThread(threadEl, ITEMS);
      var stage=rig('s09'), flash=$('#s09-flash');
      var gen=$('#s09-gen'), genbar=$('#s09-genbar'), endcap=$('#s09-endcap');

      // ---- the generated clip, built rather than fetched: a sky, clouds, and the brand orb
      // rising through them. Then Symbols: four brightness bands, each stamped with its own
      // mark and tint, resolving into the picture as the render completes.
      var cv=$('#s09-canvas'), cx=cv.getContext('2d'), W=1520, H=790;
      var off=document.createElement('canvas'), ox=off.getContext('2d');
      var CELL=25, CW=Math.ceil(W/CELL), CH=Math.ceil(H/CELL);
      off.width=CW; off.height=CH;
      var MARKS=['·','+','\u00d7','\u25a0'];
      var TINTS=['#3D6AB0','#6C9BDC','#B8D4F5','#FFFFFF'];
      function scene(g, w, h, t, orbRise){
        var sky=g.createLinearGradient(0,0,0,h);
        sky.addColorStop(0,'#1E3F7E'); sky.addColorStop(.52,'#5C8CC9'); sky.addColorStop(1,'#CBDEF2');
        g.fillStyle=sky; g.fillRect(0,0,w,h);
        var cl=[[0.10,0.84,0.30],[0.36,0.92,0.34],[0.64,0.86,0.30],[0.88,0.94,0.28],[0.24,0.70,0.16],[0.76,0.66,0.18]];
        for(var i=0;i<cl.length;i++){
          var cxp=(cl[i][0]*w + t*11*(i%2?1:-1)+w)%(w*1.2)-w*0.1, cyp=cl[i][1]*h, r=cl[i][2]*w*0.5;
          var rg=g.createRadialGradient(cxp,cyp,0,cxp,cyp,r);
          rg.addColorStop(0,'rgba(255,255,255,.95)'); rg.addColorStop(.5,'rgba(244,250,255,.55)');
          rg.addColorStop(1,'rgba(230,242,255,0)');
          g.fillStyle=rg; g.fillRect(cxp-r,cyp-r,r*2,r*2);
        }
        var oy=h*(0.82-0.42*orbRise), orr=h*0.13;
        var og=g.createRadialGradient(w*0.5-orr*0.32,oy-orr*0.38,orr*0.08,w*0.5,oy,orr);
        og.addColorStop(0,'#EAF4FF'); og.addColorStop(.28,'#67A8F2'); og.addColorStop(.72,'#1C5BC4'); og.addColorStop(1,'#0B2C74');
        g.beginPath(); g.arc(w*0.5,oy,orr,0,6.2832); g.fillStyle=og; g.fill();
        var hl=g.createRadialGradient(w*0.5-orr*0.34,oy-orr*0.44,0,w*0.5-orr*0.34,oy-orr*0.44,orr*0.5);
        hl.addColorStop(0,'rgba(255,255,255,.92)'); hl.addColorStop(1,'rgba(255,255,255,0)');
        g.beginPath(); g.arc(w*0.5,oy,orr,0,6.2832); g.fillStyle=hl; g.fill();
      }
      var state={t:0, resolve:0, orb:0, cols:0};
      function render(){
        scene(ox, CW, CH, state.t, state.orb);
        var data=ox.getImageData(0,0,CW,CH).data;
        cx.clearRect(0,0,W,H);
        cx.fillStyle='#0A1430'; cx.fillRect(0,0,W,H);
        if(state.resolve<1){
          cx.save(); cx.globalAlpha=1-state.resolve;
          cx.font='700 '+(CELL-4)+'px "Azeret Mono", monospace';
          cx.textAlign='center'; cx.textBaseline='middle';
          var lim=Math.round(CW*state.cols);
          // the columns still to come read as a faint lattice, not a black hole
          cx.globalAlpha=(1-state.resolve)*.26;
          for(var gx=lim;gx<CW;gx++){ for(var gy=0;gy<CH;gy++){
            cx.fillStyle='#4E7CC4'; cx.fillRect(gx*CELL+CELL/2-1, gy*CELL+CELL/2-1, 2, 2); } }
          cx.globalAlpha=1-state.resolve;
          for(var y=0;y<CH;y++){
            for(var x=0;x<lim;x++){
              var i=(y*CW+x)*4;
              var b=(data[i]*0.299+data[i+1]*0.587+data[i+2]*0.114)/255;
              var band=b<0.34?0:(b<0.58?1:(b<0.80?2:3));
              cx.fillStyle=TINTS[band];
              cx.fillText(MARKS[band], x*CELL+CELL/2, y*CELL+CELL/2);
            }
          }
          cx.restore();
        }
        if(state.resolve>0){
          cx.save(); cx.globalAlpha=state.resolve;
          scene(cx, W, H, state.t, state.orb);
          cx.restore();
        }
      }
      render();

      gsap.set(gen,{autoAlpha:0,scale:.93,transformOrigin:'50% 50%'});
      gsap.set(genbar,{autoAlpha:0,y:14});
      gsap.set(endcap,{autoAlpha:0,y:22});
      gsap.set($('#s09-composer-txt'),{textContent:'/zap the orb rising over clouds, 6s'});
      gsap.set(flash,{opacity:0});
      gsap.set(stage,{scale:1.0,transformOrigin:'50% 50%'});
      gsap.set(gen,{'--m':'52%'});

      // 64.412 — send. 65.991 — it answers with a time, the way a person would.
      showItem(tl,TH,0.000,8,{slide:.30});
      tl.set($('#s09-composer-txt'),{textContent:''},0.000);
      hit(tl,stage,0.000,{amt:.020});
      whipIn(tl,stage,0.000,210);
      rightIn(tl,'s09',0.06);
      showItem(tl,TH,1.579,9,{slide:.34});
      hit(tl,stage,1.579,{amt:.014});

      // 66.757 -> 67.524 — the render takes the frame as symbols, one column band per hihat
      // hit of the accel roll, then resolves into the picture it was asked for.
      tl.to('#s09-ph',{autoAlpha:0,scale:.9,duration:.30,ease:'power3.in'},2.20);
      rightOut(tl,'s09',2.16);
      tl.to(gen,{autoAlpha:1,scale:1,duration:.54,ease:'expo.out'},2.345);
      tl.to(genbar,{autoAlpha:1,y:0,duration:.44,ease:'expo.out'},2.40);
      tl.to(state,{cols:1,duration:.767,ease:'none',onUpdate:render},2.345);
      hit(tl,stage,2.345,{amt:.024});
      // the mask opens like fog clearing (Ghosty reveal)
      tl.to(gen,{'--m':'300%',duration:1.30,ease:'power2.out'},2.345);
      // 67.524 — resolved
      tl.to(state,{resolve:1,duration:1.05,ease:'power2.inOut',onUpdate:render},3.30);
      tl.to(state,{orb:1,duration:2.5,ease:'none',onUpdate:render},3.112);
      tl.to(state,{t:8,duration:3.0,ease:'none',onUpdate:render},3.112);
      tl.set($('#s09-genstate'),{textContent:'READY · 00:06'},4.35);
      hit(tl,stage,3.112,{amt:.030,flash:flash,flashAmt:.20,flashD:.24});

      // 69.103 — the turn into /create
      tl.to([gen,genbar],{autoAlpha:0,scale:.96,duration:.34,ease:'power3.in'},4.691);
      tl.to(endcap,{autoAlpha:1,y:0,duration:.64,ease:'expo.out'},4.760);
      hit(tl,stage,4.691,{amt:.020});
      cam(tl,stage,4.760,{scale:1.04,d:1.3,e:'expo.out'});
      tl.to(endcap,{autoAlpha:0,x:-200,duration:.30,ease:'power4.in'},5.98);
      whipOut(tl,stage,6.1,200);
      window.__timelines=window.__timelines||{};
      window.__timelines['shot-09-zap']=tl;
      var q=new URLSearchParams(location.search);
      if(q.has('t')){tl.seek(parseFloat(q.get('t'))||0);}else if(q.get('dev')==='1'){tl.play();}
    })();
    </script>
  </div>
</template>
