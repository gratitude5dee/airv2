    <script>
    (function(){
      var root=document.querySelector('[data-composition-id="shot-03-endowments"]');
      var frame=root.querySelector('#s03-frame');
      var eyebrow=root.querySelector('#s03-eyebrow');
      var words=root.querySelectorAll('[data-word]');
      var components=root.querySelectorAll('[data-component]');
      var sheens=root.querySelectorAll('.sheen');
      var field=root.querySelector('#s03-field');
      var note=root.querySelector('#s03-note');
      var ambient={p:0};
      function breathe(){
        var s=Math.sin(ambient.p);
        field.style.opacity=String(.28+s*.05);
        field.style.transform='scale('+(1+s*.018)+')';
      }
      gsap.set(eyebrow,{y:34,autoAlpha:0});
      gsap.set(words,{y:26,autoAlpha:0,filter:'blur(6px)'});
      gsap.set(components,{y:30,autoAlpha:0,scale:.80,rotateX:-16,transformOrigin:'50% 56%'});
      gsap.set(sheens,{x:-190,autoAlpha:0});
      gsap.set(field,{scale:.82,autoAlpha:0,transformOrigin:'50% 50%'});
      gsap.set(note,{y:22,autoAlpha:0});

      var tl=gsap.timeline({paused:true,defaults:{ease:'expo.out'}});
      tl.fromTo(frame,{x:230,autoAlpha:.35},{x:0,autoAlpha:1,duration:.34,ease:'power4.out',immediateRender:false},0);
      tl.to(eyebrow,{y:0,autoAlpha:1,duration:.66},.06);
      tl.to(field,{scale:1,autoAlpha:.28,duration:1.2,ease:'power2.out'},.38);
      // The sentence is authored as a reading sequence: every word owns an arrival, rather
      // than the whole line being present before its component can land on the music.
      var wordTimes=[.16,.28,.40,.52,.88,1.02,1.60,1.78,2.34,2.48,2.62,3.06,3.20,3.31,3.42,3.53,4.05];
      words.forEach(function(word,i){
        tl.to(word,{y:0,autoAlpha:1,filter:'blur(0px)',duration:.28,ease:'power3.out'},wordTimes[i]);
      });
      function land(index,at){
        tl.to(components[index],{y:0,autoAlpha:1,scale:1.045,rotateX:0,duration:.30,ease:'power3.out'},at);
        tl.to(components[index],{scale:1,duration:.18,ease:'power2.inOut'},at+.30);
        tl.to(sheens[index],{x:210,autoAlpha:.30,duration:.42,ease:'none'},at+.05);
        tl.to(sheens[index],{autoAlpha:0,duration:.14,ease:'power1.in'},at+.33);
      }
      // These five states land exactly on the Passwords beat grid, relative to this 13.8s shot.
      land(0,.712);land(1,1.432);land(2,2.152);land(3,2.872);land(4,3.592);
      tl.to(note,{y:0,autoAlpha:1,duration:.60},4.312);
      tl.to(ambient,{p:Math.PI*4,duration:5.45,ease:'none',onUpdate:breathe},4.32);
      tl.to(frame,{x:-42,duration:1.14,ease:'sine.inOut'},9.88);
      tl.to(frame,{x:-230,autoAlpha:0,duration:.34,ease:'power4.in'},11.16);
      window.__timelines=window.__timelines||{};
      window.__timelines['shot-03-endowments']=tl;
      var q=new URLSearchParams(location.search);
      if(q.has('t')){tl.seek(parseFloat(q.get('t'))||0);}else if(q.get('dev')==='1'){tl.play();}
    })();
