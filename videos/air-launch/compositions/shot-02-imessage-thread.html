        var b=thread.items[i], y=thread.stops[i];
        if(b.spec.hold){ y=thread.stops[i]+b.spec.hold; }
        tl.to(thread.el,{y:y,duration:opts.slide||.42,ease:'power3.out'}, t);
        tl.set(b.wrap,{autoAlpha:1}, t);
        if(b.spec.kind==='card'){
          tl.fromTo(b.inner,{y:28,autoAlpha:0,rotationX:12},{y:0,autoAlpha:1,rotationX:0,duration:.55,ease:'expo.out'}, t);
        } else if(b.spec.dim){
          tl.fromTo(b.inner,{y:14,autoAlpha:0},{y:0,autoAlpha:.56,duration:.34,ease:'power3.out'}, t);
        } else if(b.spec.side==='sent'){
          // the one overshoot in the film, because iMessage does it
          tl.fromTo(b.inner,{scale:.86,autoAlpha:0},{scale:1,autoAlpha:1,duration:.32,ease:'back.out(1.4)'}, t);
        } else {
          tl.fromTo(b.inner,{y:14,autoAlpha:0},{y:0,autoAlpha:1,duration:.34,ease:'power3.out'}, t);
        }
      }
      // typing dots ride the hihat hits of a named roll — one lift per hit, never a loop
      function typeDots(tl, dotsEl, hits){
        var ds=dotsEl.querySelectorAll('i');
        hits.forEach(function(h,i){
          var d=ds[i%3];
          tl.to(d,{y:-3,opacity:1,duration:.07,ease:'power2.out'}, h);
          tl.to(d,{y:0,opacity:.55,duration:.16,ease:'power2.inOut'}, h+.07);
        });
      }
      // per-character reveal at a fixed cadence, always landing on the send downbeat
      function typeText(tl, node, text, start, end){
        var per=(end-start)/Math.max(1,text.length);
        for(var c=1;c<=text.length;c++){
          (function(n){ tl.set(node,{textContent:text.slice(0,n)}, start+per*n); })(c);
        }
      }

      // ---- camera: punch in and out on the beat, one transform on one stage ----
      function cam(tl, stage, t, o){
        o=o||{};
        tl.to(stage,{scale:o.scale!=null?o.scale:1, x:o.x||0, y:o.y||0,
          rotation:o.rot||0, duration:o.d||.6, ease:o.e||'expo.out'}, t);
      }
      // ---- a hit: the frame answers the transient. Scale pop, optional flash, optional shake.
      function hit(tl, stage, t, o){
        o=o||{};
        var s=o.base!=null?o.base:1, amt=o.amt!=null?o.amt:.018;
        tl.to(stage,{scale:s+amt,duration:.055,ease:'power2.out'},t);
        tl.to(stage,{scale:s,duration:.30,ease:'power2.out'},t+.055);
        if(o.flash){ tl.fromTo(o.flash,{opacity:o.flashAmt||.22},{opacity:0,duration:o.flashD||.20,ease:'power2.out'},t); }
        if(o.shake){
          var a=o.shake;
          tl.to(stage,{x:'+='+a,duration:.033,ease:'none'},t);
          tl.to(stage,{x:'-='+(a*2),duration:.033,ease:'none'},t+.033);
          tl.to(stage,{x:'+='+a,duration:.033,ease:'none'},t+.066);
        }
      }
      // ---- chromatic glow: the split opens on a transient and settles back ----
      function cgPulse(tl, id, t, amt, dur){
        amt=amt||16; dur=dur||.9;
        var w=document.getElementById(id+'-warm'), c=document.getElementById(id+'-cool');
        tl.to(w,{x:-amt,y:-amt*.22,duration:.09,ease:'power2.out'},t);
        tl.to(c,{x:amt,y:amt*.22,duration:.09,ease:'power2.out'},t);
        tl.to(w,{x:-amt*.18,y:0,duration:dur,ease:'power3.out'},t+.09);
        tl.to(c,{x:amt*.18,y:0,duration:dur,ease:'power3.out'},t+.09);
      }
      function cgSet(id, amt){
        var w=document.getElementById(id+'-warm'), c=document.getElementById(id+'-cool');
        gsap.set(w,{x:-amt,y:0}); gsap.set(c,{x:amt,y:0});
      }
      // ---- Arcade pixel: draw the word tiny on a canvas, blow it up, and let the block size
      //      fall to 1 so the letters resolve out of the grid. No pixel grid is ever drawn.
      function pixelWord(canvas, text, font, color){
        var W=canvas.width, H=canvas.height, ctx=canvas.getContext('2d');
        return function(block){
          block=Math.max(1,Math.round(block));
          var w=Math.max(1,Math.round(W/block)), h=Math.max(1,Math.round(H/block));
          var off=pixelWord._o||(pixelWord._o=document.createElement('canvas'));
          off.width=w; off.height=h;
          var octx=off.getContext('2d');
          octx.clearRect(0,0,w,h);
          octx.fillStyle=color; octx.textAlign='center'; octx.textBaseline='middle';
          octx.font=font.replace(/(\d+)px/, function(m,n){ return Math.max(1,Math.round(n/block))+'px'; });
          octx.fillText(text, w/2, h/2);
          ctx.clearRect(0,0,W,H);
          ctx.imageSmoothingEnabled=false;
          ctx.drawImage(off,0,0,w,h,0,0,W,H);
        };
      }
      // ---- a card lifts out of the phone and takes the frame ----
      function takeover(tl, el, t, from, to){
        tl.fromTo(el,{x:from.x,y:from.y,scale:from.s,autoAlpha:0,rotationX:10},
                     {x:to.x,y:to.y,scale:to.s,autoAlpha:1,rotationX:0,duration:to.d||.62,ease:'expo.out'},t);
      }

      var ITEMS=[
        {kind:'sys', text:'Today · 8:42 AM', pre:true},
        {side:'recv', text:'flights for the 12th are held, not booked.', pre:true, dim:true},
        {side:'sent', text:'hold them till friday', pre:true, dim:true},
        {side:'recv', text:'done. also the invoice from thursday cleared.', pre:true, dim:true},
        {side:'recv', text:'morning — your inbox is clear. three things need you today.', pre:true, dim:true},
        {side:'sent', text:'nice. i&rsquo;ll look after lunch.', pre:true, dim:true},
        {side:'sent', text:'dinner fri 8pm at the usual spot. tell Sam.'},
        {side:'recv', text:'on it.'},
        {kind:'card', side:'recv', html:'<div data-hf-id="hf-s02ahd" class="hd"><div data-hf-id="hf-s02aic" class="ic"><div data-hf-id="hf-s02aig" class="gly" style="background-image:url(&quot;logos/glyph-mail.svg&quot;)"></div></div><div data-hf-id="hf-s02atw"><div data-hf-id="hf-s02ati" class="ti">Reservation request</div><div data-hf-id="hf-s02asb" class="sb">sent from your inbox</div></div></div>'},
        {kind:'card', side:'recv', html:'<div data-hf-id="hf-s02bhd" class="hd"><div data-hf-id="hf-s02bic" class="ic"><div data-hf-id="hf-s02big" class="gly" style="background-image:url(&quot;logos/glyph-calendar-check.svg&quot;)"></div></div><div data-hf-id="hf-s02btw"><div data-hf-id="hf-s02bti" class="ti">Held · Fri 8:00 pm</div><div data-hf-id="hf-s02bsb" class="sb">table for 2 · the usual spot</div></div></div>'},
        {kind:'card', side:'recv', html:'<div data-hf-id="hf-s02df" class="fa" id="s02-face-a"><div data-hf-id="hf-s02dhd" class="hd"><div data-hf-id="hf-s02dic" class="ic"><div data-hf-id="hf-s02dig" class="gly" style="background-image:url(&quot;logos/glyph-phone.svg&quot;)"></div></div><div data-hf-id="hf-s02dtw"><div data-hf-id="hf-s02dti" class="ti">Text Sam?</div><div data-hf-id="hf-s02dsb" class="sb">draft · tap to send</div></div></div><div data-hf-id="hf-s02dbd" class="bd">“dinner fri 8pm, usual spot. see you there.”</div><div data-hf-id="hf-s02drow" class="row"><div data-hf-id="hf-s02dok" class="btn ok" id="s02-approve">Approve</div><div data-hf-id="hf-s02ded" class="btn gh">Edit</div></div></div><div data-hf-id="hf-s02db" class="fb" id="s02-face-b"><div data-hf-id="hf-s02ehd" class="hd"><div data-hf-id="hf-s02eic" class="ic"><div data-hf-id="hf-s02eig" class="gly" style="background-image:url(&quot;logos/glyph-phone.svg&quot;)"></div></div><div data-hf-id="hf-s02etw"><div data-hf-id="hf-s02eti" class="ti">Text Sam?</div><div data-hf-id="hf-s02esb" class="sb">sent · 2 min ago</div></div></div><div data-hf-id="hf-s02done" class="done"><span data-hf-id="hf-s02dk">✓</span><span data-hf-id="hf-s02dt">Sent to Sam</span></div></div><div data-hf-id="hf-s02dsp" class="spec" id="s02-spec"></div>'},
        {kind:'sys', text:'remembered: Sam · Fridays · the usual spot'}
      ];
      var threadEl=$('#s02-thread'); threadEl.setAttribute('data-bottom','614');
      var TH=buildThread(threadEl, ITEMS); TH.el=threadEl;
      

      // the typing indicator lives outside the flow so it can vanish without moving the column
      var dw=el('div','dotswrap'); var dots=el('div','dots');
      for(var d=0;d<3;d++) dots.appendChild(el('i'));
      dw.appendChild(dots); $('#s02-screen').appendChild(dw);
      gsap.set(dw,{autoAlpha:0}); gsap.set(dots.querySelectorAll('i'),{opacity:.55});

      var ph=$('#s02-ph'), seed=$('#s02-seed'), stanza=$('#s02-stanza');
      var lines=[$$('#s02-l0 .w'),$$('#s02-l1 .w'),$$('#s02-l2 .w')];
      var caps=[$('#s02-cap1'),$('#s02-cap2')];

      gsap.set(ph,{autoAlpha:0,rotationY:-9,rotationX:4,scale:1.06,transformOrigin:'50% 50%'});
      gsap.set(seed,{x:-421,scaleX:.796,scaleY:.071,transformOrigin:'50% 50%'});
      lines.forEach(function(ws){ gsap.set(ws,{y:'0.6em',autoAlpha:0,rotationX:24,transformOrigin:'50% 80%'}); });
      gsap.set(caps,{autoAlpha:0,y:12});
      gsap.set($('#s02-face-b'),{autoAlpha:0});
      gsap.set($('#s02-spec'),{opacity:0});
      gsap.set($('#s02-slam'),{opacity:0});
      var stage=$('#s02-stage'), hf=$('#s02-hitflash');

      gsap.set(stage,{scale:1.38,x:-430,y:20,transformOrigin:'50% 50%'});

      // 10.170 (0.000) — the bubble the four banners collapsed into becomes the phone.
      // One object across the seam: no dissolve, no cut you can see.
      tl.to(seed,{x:0,scaleX:1,scaleY:1,duration:.45,ease:'expo.out'},0);
      tl.to(ph,{autoAlpha:1,duration:.30,ease:'power2.out'},.28);
      tl.to(seed,{autoAlpha:0,duration:.22,ease:'power2.inOut'},.34);

      // the camera: tight on the first message, open for the stanza, macro for the tap
      cam(tl,stage,0.349,{scale:1.38,x:-430,y:20,d:.8,e:'expo.out'});
      cam(tl,stage,3.019,{scale:1.0,x:0,y:0,d:1.6,e:'expo.out'});

      var T=[.349, 3.019, 4.551, 6.107, 7.616, 12.260];

      showItem(tl,TH,T[0],3,{slide:.36});
      // 11.587 — typing dots ride the sustained hihat fill 9.543-13.259 (absolute)

      // 14.721 / 16.277 / 17.786 — inbox, the hold, the decision

      showItem(tl,TH,T[2],5,{slide:.42});
      hit(tl,stage,6.107,{amt:.022});

      hit(tl,stage,7.616,{amt:.018});
      showItem(tl,TH,T[4],7,{slide:.42});
      // 18.158 — the decision card settles with one specular pass (holo, no rainbow)
      tl.fromTo($('#s02-spec'),{xPercent:-60,opacity:0},{xPercent:60,opacity:.5,duration:.34,ease:'power2.out'},7.988);
      tl.to($('#s02-spec'),{opacity:0,duration:.3,ease:'power2.in'},8.33);
      // 22.430 — the memory chip: the computer that remembers
      hit(tl,stage,12.260,{amt:.016});
      showItem(tl,TH,T[5],8,{slide:.42});

      // the stanza: the hero line, one clause per downbeat, behind the phone at depth 0
      [3.019,6.107,9.149].forEach(function(t,i){
        tl.to(lines[i],{y:0,autoAlpha:1,rotationX:0,duration:.70,ease:'expo.out',stagger:.04},t);
      });
      tl.to(caps[0],{autoAlpha:1,y:0,duration:.6,ease:'expo.out'},4.551);

      // 21.223 — the tap. Nothing moves money or messages without this gesture.
      hit(tl,stage,11.053,{base:1.46,amt:.020});
      tl.to($('#s02-approve'),{scale:.92,duration:.066,ease:'power2.out'},11.053);
      tl.to($('#s02-approve'),{scale:1,duration:.12,ease:'power2.inOut'},11.128);
      tl.to(TH.items[10].inner,{rotationX:-90,duration:.22,ease:'power2.in'},11.22);
      tl.set($('#s02-face-a'),{autoAlpha:0},11.44);

      tl.to(ph,{x:-9,duration:13.9,ease:'none'},0);

      // 24.358 — the crash. The phone comes at camera and its black screen becomes the cut;

      tl.to(stanza,{x:-230,autoAlpha:0,duration:.30,ease:'power4.in'},13.90);
      tl.to(caps,{autoAlpha:0,duration:.2,ease:'power2.in'},13.90);
      hit(tl,stage,13.938,{amt:.05,flash:hf,flashAmt:.34,flashD:.24,shake:10});
      tl.to(ph,{scale:2.9,rotationY:0,rotationX:0,x:-160,duration:.25,ease:'power4.in'},13.938);
      tl.to($('#s02-slam'),{opacity:1,duration:.10,ease:'power2.in'},14.088);
      window.__timelines=window.__timelines||{};
      window.__timelines['shot-02-imessage-thread']=tl;

    })();
