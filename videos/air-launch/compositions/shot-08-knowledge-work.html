    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-08-knowledge-work"]');
      var frame = root.querySelector('#s08-frame');
      var head = [root.querySelector('#s08-num'),root.querySelector('#s08-title'),
                  root.querySelector('#s08-rule'),root.querySelector('#s08-sub')];
      var surface = root.querySelector('#s08-surface');
      var prompt = root.querySelector('#s08-prompt');
      var rows = root.querySelectorAll('#s08-rows .row');
      var ticks = root.querySelectorAll('#s08-rows .tick path');
      var memchip = root.querySelector('#s08-memchip');
      var EO = 'expo.out';

      gsap.set(head,{y:52,opacity:0});
      gsap.set(surface,{y:70,opacity:0,scale:.96,transformOrigin:'50% 50%'});
      gsap.set(prompt,{y:30,opacity:0,scale:.96,transformOrigin:'100% 100%'});
      gsap.set(rows,{y:56,opacity:0});
      gsap.set(memchip,{y:22,opacity:0});
      ticks.forEach(function(p){
        var L = p.getTotalLength ? p.getTotalLength() : 40;
        gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});
      });

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});
      tl.fromTo(frame,{x:230,opacity:.35},{x:0,opacity:1,duration:.34,ease:'power4.out',immediateRender:false},0);
      head.forEach(function(el,i){ tl.to(el,{y:0,opacity:1,duration:.66},.08 + i*.11); });

      tl.to(surface,{y:0,opacity:1,scale:1,duration:.85},.42);
      tl.to(prompt,{y:0,opacity:1,scale:1,duration:.6},.80);

      // rows land on the passage's snare hits (track 56s = local 0: 2.20, 2.75, 3.26,
      // 3.95, 4.63, 5.42), each tick drawing on the after-beat
      var beats = [2.20, 2.75, 3.26, 3.95, 4.63, 5.42];
      rows.forEach(function(r,i){
        var at = beats[i];
        tl.to(r,{y:0,opacity:1,duration:.5},at - .18);
        if (ticks[i]) tl.to(ticks[i],{strokeDashoffset:0,duration:.36,ease:'power2.out'},at + .10);
      });
      tl.to(memchip,{y:0,opacity:1,duration:.55},6.20);

      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},7.16);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},7.28);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-08-knowledge-work"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
