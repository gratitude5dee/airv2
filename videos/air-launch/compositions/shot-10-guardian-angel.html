    </style>

    <div data-hf-id="hf-p2dq" class="frame clip" id="s10-frame" data-layout-allow-overflow="" data-start="0" data-duration="12" data-track-index="1">
      <div data-hf-id="hf-z992" class="head">
        <div data-hf-id="hf-3irb" class="num" id="s10-num">On the backend</div>
        <div data-hf-id="hf-akp4" class="title" id="s10-title">Every agent is a guardian angel.</div>
      </div>

      <svg data-hf-id="hf-5a97" class="wings" id="s10-wings" viewBox="0 0 1520 430" fill="none" aria-hidden="true" />

        <div data-hf-id="hf-4hq6" class="stage" data-stage=""><img data-hf-id="hf-40dp" src="logos/glyph-computer.svg" alt=""><b data-hf-id="hf-mlz9">Custom sandbox</b><span data-hf-id="hf-5bcx">Its own isolated machine, per person.</span></div>
        <div data-hf-id="hf-jb6a" class="link" data-link=""><svg data-hf-id="hf-9q0j" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path data-hf-id="hf-b9ko" d="M2 12H98" stroke="rgba(178,200,255,.75)" stroke-width="2.5" stroke-linecap="round" /></svg></div>
        <div data-hf-id="hf-zw6a" class="stage" data-stage=""><img data-hf-id="hf-qoqs" src="logos/onairos.svg" alt=""><b data-hf-id="hf-zwm9">Configurable mesh</b><span data-hf-id="hf-l6zf">Optimal routes between agents and tools.</span></div>
        <div data-hf-id="hf-gyvq" class="link" data-link=""><svg data-hf-id="hf-ncr7" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path data-hf-id="hf-y7f4" d="M2 12H98" stroke="rgba(178,200,255,.75)" stroke-width="2.5" stroke-linecap="round" /></svg></div>
        <div data-hf-id="hf-0ahb" class="stage" data-stage=""><img data-hf-id="hf-ry10" src="logos/glyph-sparkle.svg" alt=""><b data-hf-id="hf-18ka">Local task router</b><span data-hf-id="hf-nrhi">A custom quantized model, on the machine.</span></div>
        <div data-hf-id="hf-hd6r" class="link" data-link=""><svg data-hf-id="hf-myg6" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path data-hf-id="hf-x0i1" d="M2 12H98" stroke="rgba(178,200,255,.75)" stroke-width="2.5" stroke-linecap="round" /></svg></div>
        <div data-hf-id="hf-0osc" class="stage" data-stage=""><img data-hf-id="hf-2mea" src="logos/hudrl.svg" alt=""><b data-hf-id="hf-wume">RL environment</b><span data-hf-id="hf-xj01">Self-learning loops on your own tasks.</span></div>
        <div data-hf-id="hf-hrhs" class="link" data-link=""><svg data-hf-id="hf-mk55" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path data-hf-id="hf-xet2" d="M2 12H98" stroke="rgba(178,200,255,.75)" stroke-width="2.5" stroke-linecap="round" /></svg></div>
        <div data-hf-id="hf-133d" class="stage" data-stage=""><img data-hf-id="hf-qbmi" src="logos/glyph-vault.svg" alt=""><b data-hf-id="hf-pi1n">ZDR policy</b><span data-hf-id="hf-x9eg">Clean, content-zero data retention.</span></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-10-guardian-angel"]');
      var frame = root.querySelector('#s10-frame');
      var head = [root.querySelector('#s10-num'),root.querySelector('#s10-title')];
      var wingsSvg = root.querySelector('#s10-wings');
      var halo = root.querySelector('#s10-halo');
      var stages = root.querySelectorAll('#s10-chain .stage');
      var links = root.querySelectorAll('#s10-chain .link path');
      var copy = root.querySelector('#s10-copy');
      var SVGNS = 'http://www.w3.org/2000/svg';
      var EO = 'expo.out';

      // wings: five feathers per side, mirrored about the halo
      var feathers = [
        'M0 10 C 20 -104 246 -126 470 -44',
        'M0 28 C 22 -74 236 -80 476 34',
        'M0 46 C 24 -44 222 -24 452 116',
        'M0 64 C 26 -14 206 32 418 190',
        'M0 82 C 28 16 190 90 376 252'
      ];
      var wingPaths = [];
      [1,-1].forEach(function(sx){
        var g = document.createElementNS(SVGNS,'g');
        g.setAttribute('transform','translate(760,170) scale('+sx+',1)');
        feathers.forEach(function(d){
          var p = document.createElementNS(SVGNS,'path');
          p.setAttribute('d',d);
          p.setAttribute('stroke','rgba(214,226,255,.55)');
          p.setAttribute('stroke-width','3');
          p.setAttribute('stroke-linecap','round');
          p.setAttribute('fill','none');
          g.appendChild(p);
          wingPaths.push(p);
        });
        wingsSvg.appendChild(g);
      });

      // the mandated backend sentence, word by word
      var sentence = 'On the backend every agent acts as a guardian angel with a custom sandbox, ' +
        'an optimal configurable mesh, a local task router using a custom quantized model, ' +
        'an RL environment with self-learning loops, and a clean, content-zero data-retention policy.';
      sentence.split(' ').forEach(function(w){
        var s = document.createElement('span');
        s.className = 'w';
        s.textContent = w;
        copy.appendChild(s);
      });
      var words = copy.querySelectorAll('.w');

      gsap.set(head,{y:52,opacity:0});
      gsap.set(halo,{scale:.6,opacity:0,transformOrigin:'50% 50%'});
      gsap.set(stages,{y:80,opacity:0,scale:.94,transformOrigin:'50% 100%'});
      gsap.set(words,{y:26,opacity:0});
      wingPaths.forEach(function(p){
        var L = p.getTotalLength ? p.getTotalLength() : 500;
        gsap.set(p,{strokeDasharray:L,strokeDashoffset:L});
      });
      links.forEach(function(p){ gsap.set(p,{scaleX:0,transformOrigin:'0% 50%',opacity:.9}); });

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});
      tl.fromTo(frame,{x:230,opacity:.35},{x:0,opacity:1,duration:.34,ease:'power4.out',immediateRender:false},0);
      head.forEach(function(el,i){ tl.to(el,{y:0,opacity:1,duration:.7},.08 + i*.11); });

      // the wings unfold outward from the halo, feather by feather
      tl.to(halo,{scale:1,opacity:1,duration:.8},.52);
      wingPaths.forEach(function(p,i){
        tl.to(p,{strokeDashoffset:0,duration:.9,ease:'power2.out'},.70 + (i % 5)*.11 + (i > 4 ? .05 : 0));
      });

      // then the pipeline wires itself: stage, link, stage, link...
      stages.forEach(function(s,i){
        var at = 2.10 + i*.62;
        tl.to(s,{y:0,opacity:1,scale:1,duration:.72},at);
        if (links[i]) tl.to(links[i],{scaleX:1,duration:.42,ease:'power2.inOut'},at+.40);
      });

      // the sentence lands under the diagram, reading pace
      words.forEach(function(w,i){
        tl.to(w,{y:0,opacity:1,duration:.4},5.30 + i*.045);
      });

      // the finished diagram holds through the phrase, drifting left toward the cut
      tl.to(frame,{x:-30,duration:2.0,ease:'sine.inOut'},9.60);
      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},11.66);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},11.78);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-10-guardian-angel"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
  </div>
</template>
