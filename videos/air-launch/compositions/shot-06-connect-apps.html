    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root = document.querySelector('[data-composition-id="shot-06-connect-apps"]');
      var frame = root.querySelector('#s06-frame');
      var head = [root.querySelector('#s06-num'),root.querySelector('#s06-title'),
                  root.querySelector('#s06-rule')];
      var countEl = root.querySelector('#s06-count');
      var swarm = root.querySelector('#s06-swarm');
      var cards = root.querySelectorAll('#s06-featured .fcard');
      var EO = 'expo.out';

      var slugs = ['slack','figma','github','stripe','airbnb','uber','doordash','x',
                   'discord','whatsapp','telegram','reddit','tiktok','pinterest','dropbox','drive',
                   'sheets','zoom','salesforce','hubspot','asana','trello','jira','quickbooks',
                   'square','coinbase','robinhood','duolingo','strava','peloton','yelp','ebay',
                   'etsy','walmart','target','nike','adidas','soundcloud','twitch','steam',
                   'epicgames','notion-2','spotify-2','gmail','calendar','chrome','netflix','youtube'];

      // phyllotaxis swarm: golden-angle spiral (i * 137.508°, r ∝ √i) — the sunflower
      // packing, fully deterministic, blooming naturally from the centre outward
      var GA = 137.50776405 * Math.PI/180, CX = 540, CY = 420, dots = [];
      for (var i = 0; i < slugs.length; i++){
        var rad = 58 + 44 * Math.sqrt(i), ang = i * GA;
        var d = document.createElement('div');
        d.className = 'dot';
        d.style.left = (CX + rad*Math.cos(ang) - 48) + 'px';
        d.style.top  = (CY + rad*Math.sin(ang)*0.78 - 48) + 'px';
        d.innerHTML = '<img src="logos/' + slugs[i] + '.svg" alt="">';
        swarm.appendChild(d);
        dots.push(d);
      }

      gsap.set(head,{y:52,opacity:0});
      gsap.set(countEl,{y:40,opacity:0});
      gsap.set(dots,{scale:.3,opacity:0,transformOrigin:'50% 50%'});
      gsap.set(cards,{y:150,opacity:0,scale:.9,rotateX:-18,transformOrigin:'50% 100%'});

      var tl = gsap.timeline({paused:true,defaults:{ease:EO}});
      tl.fromTo(frame,{x:230,opacity:.35},{x:0,opacity:1,duration:.34,ease:'power4.out',immediateRender:false},0);
      head.forEach(function(el,i){ tl.to(el,{y:0,opacity:1,duration:.66},.08 + i*.11); });

      // the swarm blooms outward along the spiral — index order IS centre-out order
      tl.to(dots,{scale:1,opacity:1,duration:.8,overwrite:'auto',
        stagger:{each:.026,from:'start'}},.62);

      // the three named surfaces rise out of the swarm and stay lit
      tl.to(cards,{y:0,opacity:1,scale:1,rotateX:0,duration:.85,stagger:.16},2.30);

      // counter: 0 -> 1,000+
      var n = {v:0};
      tl.to(countEl,{y:0,opacity:1,duration:.66},1.10);
      tl.to(n,{v:1000,duration:2.6,ease:'power2.out',onUpdate:function(){
        var v = Math.round(n.v);
        var s = v >= 1000 ? '1,000+' : String(v);
        countEl.firstChild.nodeValue = s;
      }},1.30);

      tl.to(frame,{x:-230,duration:.34,ease:'power4.in'},7.66);
      tl.to(frame,{opacity:0,duration:.20,ease:'none'},7.78);

      window.__timelines = window.__timelines || {};
      window.__timelines["shot-06-connect-apps"] = tl;
      var q = new URLSearchParams(location.search);
      if(q.has('t')){ tl.seek(parseFloat(q.get('t'))||0); }
      else if(q.get('dev')==='1'){ tl.play(); }
    })();
    </script>
