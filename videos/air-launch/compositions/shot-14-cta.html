<template id="shot-14-cta-template">
  <div data-hf-id="hf-s14root" id="s14-root" data-composition-id="shot-14-cta" data-width="1920" data-height="1080" data-duration="6">
    <style>
      @font-face{font-family:'Inter var';font-weight:100 900;font-style:normal;font-display:block;src:local('Helvetica Neue')}
      #s14-root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;
        font-family:'Inter var',system-ui,sans-serif;color:#F7FAFF;-webkit-font-smoothing:antialiased}
      #s14-root *,#s14-root *::before,#s14-root *::after{box-sizing:border-box}
      #s14-root .frame{position:absolute;inset:0}
      #s14-root .veil{position:absolute;inset:0;background:radial-gradient(62% 54% at 50% 48%,rgba(8,20,53,.66),rgba(2,6,18,.92) 76%)}
      #s14-root .flare{position:absolute;left:50%;top:50%;width:760px;height:760px;margin:-380px;
        border-radius:50%;background:radial-gradient(circle,rgba(192,226,255,.22) 0%,rgba(108,160,255,.08) 28%,rgba(85,122,246,0) 69%);
        filter:blur(2px);pointer-events:none}
      #s14-root .content{position:absolute;left:0;right:0;top:300px;text-align:center}
      #s14-root .eyebrow{font-size:22px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:#F0F6FF}
      #s14-root .headline{margin-top:34px;font-size:114px;font-weight:600;letter-spacing:-.065em;line-height:.98;
        text-shadow:0 22px 72px rgba(2,8,28,.56)}
      #s14-root .headline .air{background:linear-gradient(100deg,#fff 0%,#dcecff 58%,#91c4ff 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent}
      #s14-root .rule{width:0;height:1px;margin:48px auto 34px;background:linear-gradient(90deg,rgba(162,204,255,0),rgba(223,240,255,.92),rgba(162,204,255,0))}
      #s14-root .url{display:inline-flex;align-items:center;gap:18px;font-size:48px;font-weight:500;letter-spacing:-.035em;color:#F7FAFF;
        text-shadow:0 14px 42px rgba(2,8,28,.58)}
      #s14-root .url-dot{width:11px;height:11px;border-radius:50%;background:#9dcbff;box-shadow:0 0 22px rgba(139,195,255,.9)}
      #s14-root .sub{margin-top:32px;font-size:20px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#EAF2FF}
      #s14-root .favicon{width:72px;height:72px;display:block;margin:42px auto 0;
        border-radius:50%;filter:drop-shadow(0 10px 22px rgba(73,151,255,.48));will-change:transform,opacity}
    </style>
    <div data-hf-id="hf-s14frame" class="frame clip" id="s14-frame" data-layout-allow-overflow="" data-start="0" data-duration="6" data-track-index="1">
      <div data-hf-id="hf-s14veil" class="veil" id="s14-veil"></div>
      <div data-hf-id="hf-s14flare" class="flare" id="s14-flare"></div>
      <div data-hf-id="hf-s14content" class="content" id="s14-content">
        <div data-hf-id="hf-s14eyebrow" class="eyebrow" id="s14-eyebrow">A personal agent, built around you</div>
        <div data-hf-id="hf-s14headline" class="headline" id="s14-headline">Get your <span data-hf-id="hf-s14air" class="air">air</span> today.</div>
        <div data-hf-id="hf-s14rule" class="rule" id="s14-rule"></div>
        <div data-hf-id="hf-s14url" class="url" id="s14-url"><span data-hf-id="hf-s14dot" class="url-dot"></span><span data-hf-id="hf-s14urltext">air.wzrd.tech</span></div>
        <div data-hf-id="hf-s14sub" class="sub" id="s14-sub">available now</div>
        <img data-hf-id="hf-s14favicon" class="favicon" id="s14-favicon" src="logos/air-brand.png" alt="Air">
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      var root=document.querySelector('[data-composition-id="shot-14-cta"]');
      var veil=root.querySelector('#s14-veil');
      var flare=root.querySelector('#s14-flare');
      var eyebrow=root.querySelector('#s14-eyebrow');
      var headline=root.querySelector('#s14-headline');
      var rule=root.querySelector('#s14-rule');
      var url=root.querySelector('#s14-url');
      var sub=root.querySelector('#s14-sub');
      var favicon=root.querySelector('#s14-favicon');
      gsap.set(veil,{opacity:0});
      gsap.set(flare,{scale:.7,opacity:0,transformOrigin:'50% 50%'});
      gsap.set([eyebrow,headline],{y:28,opacity:0});
      gsap.set(rule,{width:0,opacity:0});
      gsap.set([url,sub],{y:18,opacity:0});
      gsap.set(favicon,{scale:.72,opacity:0,transformOrigin:'50% 50%'});
      var tl=gsap.timeline({paused:true,defaults:{ease:'expo.out'}});
      tl.to(veil,{opacity:1,duration:.7,ease:'power2.out'},0);
      tl.to(flare,{scale:1,opacity:1,duration:1.15},0);
      tl.to(eyebrow,{y:0,opacity:1,duration:.66},.28);
      tl.to(headline,{y:0,opacity:1,duration:.82},.48);
      tl.to(rule,{width:420,opacity:1,duration:.72,ease:'power2.out'},1.16);
      tl.to(url,{y:0,opacity:1,duration:.72},1.38);
      tl.to(sub,{y:0,opacity:1,duration:.62},1.64);
      tl.to(favicon,{scale:1,opacity:1,duration:.74},1.88);
      tl.to(flare,{scale:1.08,opacity:.78,duration:2.4,ease:'sine.inOut'},2.05);
      window.__timelines=window.__timelines||{};
      window.__timelines['shot-14-cta']=tl;
      var q=new URLSearchParams(location.search);
      if(q.has('t')){tl.seek(parseFloat(q.get('t'))||0);}else if(q.get('dev')==='1'){tl.play();}
    })();
    </script>
  </div>
</template>
