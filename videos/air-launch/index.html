      #air-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #050810; }

        opacity: .10; transform-origin: 62% 62%;

          radial-gradient(42% 38% at 62% 62%, rgba(255,226,186,.40) 0%, rgba(168,198,255,.14) 40%, rgba(75,112,205,0) 78%),

      // are no dissolves and no wipes in v3 — the sky carries every seam.

      rootTimeline.set("#music-bloom", { scale: 1 }, 0);

        rootTimeline.to("#music-bloom", { opacity: .10, scale: 1, duration: .68, ease: "power2.inOut" }, at + .10);
      });
